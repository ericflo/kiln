# Kiln configuration — all values shown are defaults.
# Environment variables (KILN_*) override any value set here.
#
# Config file resolution order:
#   1. --config <path> CLI argument
#   2. KILN_CONFIG environment variable
#   3. ./kiln.toml in the current working directory
#   4. No file — built-in defaults
#
# Minimum required for real (non-mock) inference: set `model.path` —
# everything else has a working default. Paste this:
#
#   [model]
#   path = "/path/to/Qwen3.5-4B"
#
# Omitting `model.path` boots mock mode (handy for trying the CLI without
# weights). See QUICKSTART.md or https://ericflo.github.io/kiln/quickstart.html.

[server]
host = "127.0.0.1"                    # Kiln has no built-in auth. Set "0.0.0.0" to accept
                                      # remote connections ONLY behind an authenticated
                                      # reverse proxy or on a private network (WireGuard,
                                      # Tailscale) — see README "Security model".
port = 8420
request_timeout_secs = 600
shutdown_timeout_secs = 5
# eval_mode = false
# default_thinking_enabled = false     # Optional. Qwen3.5-4B profile preserves the
                                      # official template thinking default unless this
                                      # is set; eval mode still defaults omitted
                                      # requests to enable_thinking=false. Requests
                                      # can override chat_template_kwargs.enable_thinking.
# fold_reasoning_into_content = false # Optional. Compatibility mode for clients that expect
                                      # non-empty assistant content: duplicate separated
                                      # reasoning_content into content. Requests can override
                                      # this with fold_reasoning_into_content.

[model]
# path = "/path/to/model"            # Required for real inference (omit for mock mode)
model_id = "Qwen/Qwen3.5-4B"
# tokenizer_path = "/path/to/tokenizer.json"
# adapter_dir = "/path/to/adapters"  # Qwen3.5-4B profile default: <model_path>/adapters
# served_model_id = "Qwen3.5-4B" # ID exposed at /v1/models and echoed in chat completion
                                      # responses. Default: derived from `model_id` by stripping
                                      # everything up to and including the last "/" (so
                                      # "Qwen/Qwen3.5-4B" becomes
                                      # "Qwen3.5-4B"). Override precedence:
                                      #   --served-model-id flag > KILN_SERVED_MODEL_ID env >
                                      #   this TOML value > derived default.
                                      #
                                      # GPTQ INT4 quantization: point `path` at a GPTQ model directory
                                      # containing quantize_config.json. Kiln auto-detects GPTQ and
                                      # dequantizes INT4 weights to BF16 during loading.

[memory]
# num_blocks = 256                   # KV cache blocks (auto-sized from VRAM if omitted).
                                      # Each block holds 16 tokens of K+V across all
                                      # full-attention layers. CUDA auto-sizing fills
                                      # `inference_memory_fraction` of free VRAM with
                                      # blocks; explicit values override this. Also
                                      # settable via KILN_NUM_BLOCKS env var.
# gpu_memory_gb = 24.0               # Override detected VRAM (for testing)
inference_memory_fraction = 0.7       # Fraction of VRAM for inference (rest for training)
# training_memory_gb = 4.0           # Override auto-calculated training budget
# kv_cache_fp8 = true                # FP8 (E4M3) KV cache quantization — halves memory, ~2x longer context
                                      # Also settable via KILN_KV_CACHE_FP8=1 env var

[training]
# grad_checkpoint_segments = 4       # Segments for gradient checkpointing
no_grad_checkpoint = false
# checkpoint_interval = 50           # Save adapter every N training steps
#
# Optimizer: the default is Muon (momentum-orthogonalized SGD) — it
# converges LoRA fine-tunes in fewer steps than AdamW at roughly half the
# optimizer state (one momentum buffer vs Adam's two moments), and ships
# fused on-device Newton-Schulz kernels for every backend (CUDA, ROCm,
# Vulkan, Metal). The optimizer is chosen per-request in the SFT/GRPO/OPD
# JSON body, e.g.:
#   "optimizer": {"kind": "muon", "momentum": 0.95, "nesterov": true, "ns_iters": 5, "weight_decay": 0.0}
#   "optimizer": {"kind": "adam_w", "beta1": 0.9, "beta2": 0.999, "eps": 1e-8, "weight_decay": 0.0}
#   "optimizer": {"kind": "sgd"}
# Omit the field entirely to use the Muon default. Muon uses a larger
# learning rate than AdamW (its orthogonalized, RMS-matched update is
# ~unit scale): ~2e-2 vs AdamW's ~1e-4 for LoRA. Omit `learning_rate`
# from the request and the server picks the per-optimizer default
# automatically (Muon 2e-2 / AdamW 1e-4 for SFT, scaled down 10x for
# GRPO/OPD); the train receipt records the resolved value.
# webhook_url = "https://example.com/hook"  # POST training completion JSON to this URL.
                                              # Fields: job_id, job_type (sft|grpo),
                                              # status (completed|failed), adapter_name,
                                              # adapter_path, error, timestamp (RFC3339).
                                              # Fire-and-forget with a 5s timeout — webhook
                                              # failures are logged but do not affect job state.
                                              # Override via KILN_TRAINING_WEBHOOK_URL.

[logging]
level = "info"                        # trace, debug, info, warn, error, or a filter directive
format = "auto"                       # auto (pretty on TTY, JSON otherwise), json, pretty, text, human

[prefix_cache]
enabled = true                        # Reuse KV cache blocks for shared prompt prefixes
# max_blocks = 64                     # Max blocks for prefix cache (default: 50% of total)
# max_entries = 20                    # Max cached prompt snapshots (auto-sized by VRAM if omitted).
                                      # Each real-backend entry retains ~49 MiB of GDN state
                                      # on Qwen3.5-4B, separate from KV blocks.

[speculative]
enabled = false                       # Self-speculative decoding (skip-layer draft)
num_speculative_tokens = 256          # Upper bound on drafted tokens per step (the paged
                                      # skip-layer draft adapts within this budget)
draft_layers = 8                      # First N layers used as draft model
                                      # Also settable via KILN_SPEC_ENABLED, KILN_SPEC_NUM_TOKENS,
                                      # KILN_SPEC_DRAFT_LAYERS env vars

[eval]
# Root directory for eval suites, datasets, and judgment stores.
# Defaults to "<state_dir>/eval" when omitted. Subdirectories:
#   <root>/suites/       — versioned EvalSuite JSON (SuiteRegistry)
#   <root>/datasets/     — uploaded SFT/GRPO JSONL + manifest.json
#   <root>/judgments/    — A/B preference rows + manifest (judge LoRA flywheel)
# Override via KILN_EVAL_ROOT.
# root = "/var/kiln/eval"

# Cap on terminal eval jobs retained in memory. Older entries past
# `tracked_job_ttl` (shared with training) are GC'd by the eval worker so
# long-running servers don't grow `state.eval_jobs` unbounded.
# max_tracked_eval_jobs = 256

# Default generation parameters used when a suite or request does not override.
# Identical knobs to the request-level `generation` block on /v1/eval/run.
# [eval.generation]
# temperature = 0.0
# max_tokens = 512
# seed = 42

# §10.6 self-improvement flywheel scheduler. Omit the section (or the
# interval) to keep the weekly loop manual (`kiln self-improve`).
#
# [agent]
# # Run the self_improve loop every N hours (168 = weekly). The first run
# # fires one full interval after startup — never at boot.
# self_improve_interval_hours = 168
# # Optional request overrides (same shape as POST /v1/agent/self_improve).
# # Add post_eval to gate every scheduled round behind §8.7 promotion:
# # auto-load defers until the eval passes; failures demote to <name>.failed.
# [agent.self_improve]
# agent = "pi-coder-current"
# judge = "judge-pi-v1"
# post_eval = { suite = "qwen3.5-agentic-core", min_accuracy = 0.7 }

[request_log]
# Durable request/response log for the inference endpoints
# (/v1/chat/completions, /v1/completions, /v1/completions/batch). Every
# request and the exact response (SSE streams reassembled into the final
# message) is appended as one JSON line, so production traffic can be
# mined, filtered, and trained on later:
#
#   zcat requests-*.jsonl.gz | jq -c 'select(.status == 200)
#     | {messages: (.request.messages + [.response.choices[0].message])}'
#
# Files: <dir>/requests-current.jsonl (active) and rotated
# requests-<ts>.jsonl.gz. Env overrides: KILN_REQUEST_LOG_ENABLED,
# KILN_REQUEST_LOG_DIR, KILN_REQUEST_LOG_MAX_FILE_BYTES,
# KILN_REQUEST_LOG_MAX_TOTAL_BYTES, KILN_REQUEST_LOG_COMPRESS.
enabled = true
# dir = "/var/kiln/requests"          # Default: <adapter_dir>/.requests
max_file_bytes = 67108864             # Rotate the active file at 64 MiB
max_total_bytes = 2147483648          # Keep at most 2 GiB of log files (oldest deleted)
compress = true                       # Gzip rotated files
max_capture_bytes = 4194304           # Per-body cap stored in a row (wire is never truncated)

[adapters]
max_disk_bytes = 107374182400         # 100 GiB cap on total finalized adapter_dir size.
                                      # Rejects POST /v1/adapters/upload with HTTP 507
                                      # `adapter_disk_quota_exceeded` when the sum of
                                      # finalized adapters + the just-extracted upload
                                      # would exceed this. `.upload-tmp-*/` and `.composed/`
                                      # are excluded (bounded separately).
                                      # Override via KILN_ADAPTERS_MAX_DISK_BYTES.
                                      # To disable the cap entirely, set the env var to 0
                                      # (or empty): `KILN_ADAPTERS_MAX_DISK_BYTES=0`.
composed_cache_max_bytes = 10737418240 # 10 GiB byte cap on the on-disk composed-adapter
                                      # cache at adapter_dir/.composed/<hash>/. Each unique
                                      # (name, scale) permutation in /v1/chat/completions
                                      # `adapters: [...]` writes a new merged adapter. After
                                      # a successful synthesize, oldest entries (by mtime) are
                                      # evicted until total bytes drop below this cap.
                                      # Override via KILN_ADAPTERS_COMPOSED_CACHE_MAX_BYTES.
                                      # Set to 0 (or empty) to disable the byte cap.
composed_cache_max_entries = 64       # Entry-count cap on the same composed-adapter cache.
                                      # Cheap independent guard against permutation loops with
                                      # tiny adapters that would not blow past the byte cap
                                      # quickly. Eviction order matches the byte cap (oldest
                                      # mtime first); cache hits refresh mtime so reuse counts
                                      # as recency. Override via
                                      # KILN_ADAPTERS_COMPOSED_CACHE_MAX_ENTRIES. Set to 0
                                      # (or empty) to disable the entry cap.

# -----------------------------------------------------------------------------
# Memory budget (env-only; no [memory] section needed).
# -----------------------------------------------------------------------------
# KILN_GPU_MEMORY_GB
#   Override the auto-detected GPU memory (in GB, decimal OK). Highest priority
#   among VRAM detection sources — useful when nvidia-smi or DRM sysfs misreport,
#   or when you want to deliberately cap kiln serve below physical capacity.
#
# KILN_TRAINING_MEMORY_RESERVE_GB
#   On unified-memory systems (Apple Silicon, AMD APUs like Strix Halo), this is
#   the GB held back from MemTotal before declaring the training budget. Default
#   is `max(6, MemTotal / 4)` — chosen so the OS, X/Wayland compositor, and any
#   other apps don't get crowded out when training occupies most of system RAM.
#   On a 30 GB unified APU the default reserve is 7.5 GB, leaving ~22.5 GB for
#   training. Lower it (e.g. 4) to free more headroom for training; raise it
#   (e.g. 12) on a workstation that runs heavier desktop workloads alongside.
#
# Unified-memory detection (Linux):
#   On a Linux host with an integrated AMD/Intel GPU, the BIOS-configured VRAM
#   carveout reported via /sys/class/drm/card*/device/mem_info_vram_total can far
#   exceed physical RAM (the GTT heap pages against system memory). When kiln
#   detects this — `mem_info_vram_total > MemTotal × 1.25`, OR a display
#   controller + integrated AMD/Intel vendor + GTT ≥ 1 GB — it corrects the
#   budget down to `min(reported_vram, MemTotal − reserve)` so training sized
#   against this number cannot exhaust system RAM. The "GPU memory budget" log
#   line at startup includes a `vram_source = linux-drm-sysfs-unified` field so
#   the corrected value is honest about its provenance.
