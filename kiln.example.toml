# Kiln configuration — all values shown are defaults.
# See docs/CONFIGURATION.md for the complete field, validation, precedence,
# source-attribution, and environment-override reference. Only aliases listed
# there are public startup overrides; arbitrary KILN_* names are not config.
#
# Config file resolution order:
#   1. --config <path> CLI argument
#   2. KILN_CONFIG environment variable
#   3. ./kiln.toml in the current working directory
#   4. No file — built-in defaults
#
# Minimum required for real (non-mock) inference: set `model.path` —
# everything else has a working default. Paste this:
#
#   [model]
#   path = "/path/to/Qwen3.5-4B"
#
# Omitting `model.path` boots mock mode (handy for trying the CLI without
# weights). See QUICKSTART.md or https://ericflo.github.io/kiln/quickstart.html.

[server]
serving_profile = "stable"              # Immutable process-lifetime GPU ownership policy.
                                        # stable: inference only, no live physical mutation;
                                        # experimental: dynamic development behavior;
                                        # maintenance: inference disabled, drained exclusive work.
                                        # KILN_SERVER_SERVING_PROFILE overrides this strictly. See
                                        # docs/SERVING_PROFILES.md for the restart workflow.
deterministic = false                    # Serving repeatability envelope. True freezes the process-
                                        # wide determinism selector and forces one concurrent decode
                                        # row, even when max_decode_batch is wider. It does not make
                                        # every accelerator kernel bitwise deterministic. Override
                                        # strictly with KILN_SERVER_DETERMINISTIC; malformed values fail
                                        # startup instead of silently disabling determinism.
host = "127.0.0.1"                    # Kiln has no built-in auth. Set "0.0.0.0" to accept
                                      # remote connections ONLY behind an authenticated
                                      # reverse proxy or on a private network (WireGuard,
                                      # Tailscale) — see README "Security model".
port = 8420
request_timeout_secs = 600
shutdown_timeout_secs = 5
chat_performance_metadata = false       # Include per-request timing metadata in chat responses.
chat_config_hash_metadata = false       # Include effective config hashes in chat responses.
slow_request_warn_secs = 30             # Structured warning threshold; 0 disables warnings.
# http_send_buffer_bytes = 4096         # Optional per-connection SO_SNDBUF request, useful for
                                        # deterministic slow-client/backpressure testing. The OS
                                        # may round it, and Linux reports 2x for bookkeeping. Kiln
                                        # normalizes and preflights the value before readiness,
                                        # failing startup if application is ineffective. Requested,
                                        # kernel-readback, and effective values are in health/debug.
                                        # Valid range:
                                        # 1024..=16777216. Override strictly with
                                        # KILN_SERVER_HTTP_SEND_BUFFER_BYTES; malformed/zero/out-of-range
                                        # values are fatal startup errors.
stream_stall_grace_ms = 2000             # Maximum continuous time a full 64-event response channel
                                        # may make no delivery progress before only that request is
                                        # cancelled. Delivery runs outside the compute actor; any
                                        # successful event resets this clock. This is not the request
                                        # or socket timeout. Valid range: 10..=2000.
                                        # KILN_SERVER_STREAM_STALL_GRACE_MS overrides this strictly;
                                        # malformed/zero/out-of-range values fail startup. The
                                        # effective value and source are in health/debug state.
max_batch_tokens = 512                   # Combined decode-plus-prefill token budget per batching
                                        # actor cycle. Existing decode rows consume one token each;
                                        # admission and resumable prefill share the remainder.
                                        # Valid range:
                                        # 2..=65536. KILN_SERVER_MAX_BATCH_TOKENS overrides this strictly;
                                        # the effective value and source are in health/debug state.
max_prefill_tokens_per_cycle = 64        # Independent prompt-token ceiling inside the combined
                                        # budget. Decode reserves its rows first, then prompt work
                                        # advances round-robin by at most this many tokens before the
                                        # next decode cohort. Lower values favor ITL; higher values
                                        # favor prompt throughput. Valid range: 1..=65536. Override
                                        # strictly with KILN_SERVER_MAX_PREFILL_TOKENS_PER_CYCLE.
max_prefill_layers_per_cycle = 4         # Transformer layers processed before a retained prompt
                                        # chunk yields to the next decode cohort. Its token width is
                                        # charged once when selected; the same hidden state and width
                                        # resume without a second token charge or layer replay. Lower
                                        # values favor ITL; higher values reduce scheduling and
                                        # synchronization overhead. Valid range: 1..=1024. Override
                                        # strictly with KILN_SERVER_MAX_PREFILL_LAYERS_PER_CYCLE.
                                        # Every third dispatch remains round-robin; the other two
                                        # may accelerate the shortest tail of at most four chunks.
max_decode_batch = "auto"                # Concurrent decode-row ceiling. "auto" selects the active
                                        # backend policy; an integer in 1..=65536 sets an operator
                                        # ceiling. Deterministic mode and max_batch_tokens may lower
                                        # the effective value. KILN_SERVER_MAX_DECODE_BATCH overrides this
                                        # strictly and also accepts "auto". Startup, /health,
                                        # /v1/config, and debug report all sources and constraints.
# eval_mode = false
# default_thinking_enabled = false     # Optional. Qwen3.5-4B profile preserves the
                                      # official template thinking default unless this
                                      # is set; eval mode still defaults omitted
                                      # requests to enable_thinking=false. Requests
                                      # can override chat_template_kwargs.enable_thinking.
# default_thinking_budget_tokens = 512 # Optional maximum tokens inside an open thinking
                                      # block. Omit for unlimited. Requests inherit this
                                      # when thinking_budget_tokens is omitted; explicit
                                      # JSON null disables the default, and 0 closes
                                      # thinking immediately. The environment override accepts
                                      # only a non-negative integer or "unlimited" and otherwise
                                      # fails startup.
# default_thinking_budget_ms = 5000    # Optional thinking decode-time limit in milliseconds.
                                      # Queue and prefill time are excluded. Omit for
                                      # unlimited; thinking_budget_ms follows the same
                                      # omitted/null/0 request semantics as the token limit. Its
                                      # environment override uses the same strict grammar.
# fold_reasoning_into_content = false # Optional. Compatibility mode for clients that expect
                                      # non-empty assistant content: duplicate separated
                                      # reasoning_content into content. Requests can override
                                      # this with fold_reasoning_into_content.

[model]
# path = "/path/to/model"            # Required for real inference (omit for mock mode)
model_id = "Qwen/Qwen3.5-4B"
# tokenizer_path = "/path/to/tokenizer.json"
# adapter_dir = "/path/to/adapters"  # Qwen3.5-4B profile default: <model_path>/adapters
# snapshot_dir = "/fast/private/path" # Parent for the private immutable weight
                                      # snapshot. Reflink/clonefile is used when
                                      # available; otherwise startup needs room
                                      # for a full copy. KILN_MODEL_SNAPSHOT_DIR
                                      # overrides this value. The snapshot lives
                                      # until deferred MTP no longer needs it
                                      # (normally process exit) and is cleaned.
# served_model_id = "Qwen3.5-4B" # ID exposed at /v1/models and echoed in chat completion
                                      # responses. Default: derived from `model_id` by stripping
                                      # everything up to and including the last "/" (so
                                      # "Qwen/Qwen3.5-4B" becomes
                                      # "Qwen3.5-4B"). Override precedence:
                                      #   --served-model-id flag >
                                      #   KILN_MODEL_SERVED_MODEL_ID env >
                                      #   legacy KILN_SERVED_MODEL_ID env >
                                      #   this TOML value > derived default.
                                      #
                                      # GPTQ INT4 quantization: point `path` at a GPTQ model directory
                                      # containing quantize_config.json. Kiln auto-detects GPTQ and
                                      # dequantizes INT4 weights to BF16 during loading.

[memory]
# num_blocks = 256                   # KV cache blocks (auto-sized from VRAM if omitted).
                                      # Each block holds 16 tokens of K+V across all
                                      # full-attention layers. CUDA auto-sizing fills
                                      # `inference_memory_fraction` of free VRAM with
                                      # blocks; explicit values override this. Also
                                      # settable via KILN_MEMORY_NUM_BLOCKS env var.
# gpu_memory_gb = 24.0               # Override detected VRAM (for testing)
inference_memory_fraction = 0.7       # Fraction of VRAM for inference (rest for training)
# training_memory_gb = 4.0           # Override auto-calculated training budget
# kv_cache_fp8 = true                # FP8 (E4M3) KV cache quantization — halves memory, ~2x longer context
                                      # Also settable via KILN_MEMORY_KV_CACHE_FP8=1 env var
cuda_graphs = true                    # CUDA graph capture/replay policy. Non-CUDA backends
                                      # resolve their graph policy separately while config
                                      # consolidation is in progress.

[teachers]
# Remote API credentials are server-owned handles. A registration submits only
# `"credential_id": "primary-vllm"`; it cannot choose an environment variable.
# The origin must be canonical and exact (no trailing slash or path). HTTPS is
# required off-host. Kiln fails startup when a configured secret is missing or
# empty, and refuses to send it to any other origin.
#
# [teachers.credentials.primary-vllm]
# origin = "https://vllm.example.com:8443"
# api_key_env = "KILN_VLLM_API_KEY"
#
# Loopback vLLM may be registered without a credential_id. Add a scoped handle
# here instead when the loopback server itself requires authentication.

[training]
# grad_checkpoint_segments = 4       # Segments for gradient checkpointing
no_grad_checkpoint = false
# checkpoint_interval = 50           # Save adapter every N training steps
max_queued_jobs = 32                  # Admission bound for queued/running training jobs.
max_tracked_jobs = 1024               # In-memory bound including terminal job records.
tracked_job_ttl_secs = 604800         # Retain terminal records for seven days.
#
# Optimizer: the default is Muon (momentum-orthogonalized SGD) — it
# converges LoRA fine-tunes in fewer steps than AdamW at roughly half the
# optimizer state (one momentum buffer vs Adam's two moments), and ships
# fused on-device Newton-Schulz kernels for every backend (CUDA, ROCm,
# Vulkan, Metal). The optimizer is chosen per-request in the SFT/GRPO/OPD
# JSON body, e.g.:
#   "optimizer": {"kind": "muon", "momentum": 0.95, "nesterov": true, "ns_iters": 5, "weight_decay": 0.0}
#   "optimizer": {"kind": "adam_w", "beta1": 0.9, "beta2": 0.999, "eps": 1e-8, "weight_decay": 0.0}
#   "optimizer": {"kind": "sgd"}
# Omit the field entirely to use the Muon default. Muon uses a larger
# learning rate than AdamW (its orthogonalized, RMS-matched update is
# ~unit scale): ~2e-2 vs AdamW's ~1e-4 for LoRA. Omit `learning_rate`
# from the request and the server picks the per-optimizer default
# automatically (Muon 2e-2 / AdamW 1e-4 for SFT, scaled down 10x for
# GRPO/OPD); the train receipt records the resolved value.
# webhook_url = "https://example.com/hook"  # POST training completion JSON to this URL.
                                              # Fields: job_id, job_type (sft|grpo),
                                              # status (completed|failed), adapter_name,
                                              # adapter_path, error, timestamp (RFC3339).
                                              # Fire-and-forget with a 5s timeout — webhook
                                              # failures are logged but do not affect job state.
                                              # Override via KILN_TRAINING_WEBHOOK_URL.

[logging]
level = "info"                        # trace, debug, info, warn, error, or a filter directive
format = "auto"                       # auto (pretty on TTY, JSON otherwise), json, pretty, text, human

[prefix_cache]
enabled = true                        # Reuse KV cache blocks for shared prompt prefixes
# max_blocks = 64                     # Max blocks for prefix cache (default: 50% of total)
# max_entries = 20                    # Max cached prompt snapshots (auto-sized by VRAM if omitted).
                                      # Each real-backend entry retains ~49 MiB of GDN state
                                      # on Qwen3.5-4B, separate from KV blocks.

[speculative]
enabled = false                       # Self-speculative decoding for direct non-streaming
                                      # generation. Direct SSE streams temporarily use settled
                                      # single-token decode even when this is enabled.
method = "off"                         # off, skip_layer, or mtp. enabled=true with off retains
                                      # the legacy skip_layer fallback.
num_speculative_tokens = 256          # Upper bound on drafted tokens per step (the paged
                                      # skip-layer draft adapts within this budget)
draft_layers = 8                      # First N layers used as draft model
                                      # Also settable via KILN_SPECULATIVE_ENABLED,
                                      # KILN_SPECULATIVE_NUM_SPECULATIVE_TOKENS, and
                                      # KILN_SPECULATIVE_DRAFT_LAYERS env vars.

[streaming_prefill]
enabled = false                       # Typed long-prefill policy. Runtime propagation into all
                                      # model/training paths is still being consolidated; until
                                      # that lands, lower layers may retain backend auto-policy.
tile_tokens = 8192                    # Positive multiple of 64.
last_token_lm_head = true             # Compute only the final-token LM head for tiled prefill.

[eval]
# Directory containing named suite JSON. Omit for <adapter_dir>/.eval/suites.
# eval_dir = "/var/lib/kiln/eval/suites"
max_queued_jobs = 32                  # Admission bound for queued/running eval jobs.
max_tracked_jobs = 1024               # In-memory bound including terminal eval records.
# webhook_url = "https://example.com/eval-hook" # Optional terminal-state callback.

# §10.6 self-improvement flywheel scheduler. Omit the section (or the
# interval) to keep the weekly loop manual (`kiln self-improve`).
#
# [agent]
# # Run the self_improve loop every N hours (168 = weekly). The first run
# # fires one full interval after startup — never at boot.
# self_improve_interval_hours = 168
# # Embedded pi runs (POST /v1/agent/runs): the server drives pi itself,
# # streams the trajectory live, and auto-indexes finished sessions into
# # the agent-trace layer. Network-bound serving requires the security model
# # documented in README.md; arbitrary runtime environment flags are not
# # part of this typed configuration contract.
# max_concurrent_runs = 2       # runs executing at once (FIFO queue)
# run_timeout_secs = 900        # wall-clock cap per run (abort + index partial)
# # Optional request overrides (same shape as POST /v1/agent/self_improve).
# # Add post_eval to gate every scheduled round behind §8.7 promotion:
# # auto-load defers until the eval passes; failures demote to <name>.failed.
# [agent.self_improve]
# agent = "pi-coder-current"
# judge = "judge-pi-v1"
# post_eval = { suite = "qwen3.5-agentic-core", min_accuracy = 0.7 }

[request_log]
# Durable request/response log for the inference endpoints
# (/v1/chat/completions, /v1/completions, /v1/completions/batch). Every
# request and the exact response (SSE streams reassembled into the final
# message) is appended as one JSON line, so production traffic can be
# mined, filtered, and trained on later:
#
#   zcat requests-*.jsonl.gz | jq -c 'select(.status == 200)
#     | {messages: (.request.messages + [.response.choices[0].message])}'
#
# Files: <dir>/requests-current.jsonl (active) and rotated
# requests-<ts>.jsonl.gz. Env overrides: KILN_REQUEST_LOG_ENABLED,
# KILN_REQUEST_LOG_DIR, KILN_REQUEST_LOG_MAX_FILE_BYTES,
# KILN_REQUEST_LOG_MAX_TOTAL_BYTES, KILN_REQUEST_LOG_COMPRESS,
# KILN_REQUEST_LOG_MAX_CAPTURE_BYTES.
enabled = true
# dir = "/var/kiln/requests"          # Default: <adapter_dir>/.requests
max_file_bytes = 67108864             # Rotate the active file at 64 MiB
max_total_bytes = 2147483648          # Keep at most 2 GiB of log files (oldest deleted)
compress = true                       # Gzip rotated files
max_capture_bytes = 4194304           # Per-body cap stored in a row (wire is never truncated)

[adapters]
max_disk_bytes = 107374182400         # 100 GiB cap on total finalized adapter_dir size.
                                      # Rejects POST /v1/adapters/upload with HTTP 507
                                      # `adapter_disk_quota_exceeded` when the sum of
                                      # finalized adapters + the just-extracted upload
                                      # would exceed this. `.upload-tmp-*/` and `.composed/`
                                      # are excluded (bounded separately).
                                      # Override via KILN_ADAPTERS_MAX_DISK_BYTES.
                                      # To disable the cap entirely, set the env var to 0
                                      # (or empty): `KILN_ADAPTERS_MAX_DISK_BYTES=0`.
composed_cache_max_bytes = 10737418240 # 10 GiB byte cap on the on-disk composed-adapter
                                      # cache at adapter_dir/.composed/<hash>/. Each unique
                                      # (name, scale) permutation in /v1/chat/completions
                                      # `adapters: [...]` writes a new merged adapter. After
                                      # a successful synthesize, oldest entries (by mtime) are
                                      # evicted until total bytes drop below this cap.
                                      # Override via KILN_ADAPTERS_COMPOSED_CACHE_MAX_BYTES.
                                      # Set to 0 (or empty) to disable the byte cap.
composed_cache_max_entries = 64       # Entry-count cap on the same composed-adapter cache.
                                      # Cheap independent guard against permutation loops with
                                      # tiny adapters that would not blow past the byte cap
                                      # quickly. Eviction order matches the byte cap (oldest
                                      # mtime first); cache hits refresh mtime so reuse counts
                                      # as recency. Override via
                                      # KILN_ADAPTERS_COMPOSED_CACHE_MAX_ENTRIES. Set to 0
                                      # (or empty) to disable the entry cap.

# -----------------------------------------------------------------------------
# Unified-memory detection notes.
# -----------------------------------------------------------------------------
# Configure explicit capacity through `memory.gpu_memory_gb` and an explicit
# training budget through `memory.training_memory_gb` above. Their canonical
# startup overrides are `KILN_MEMORY_GPU_MEMORY_GB` and
# `KILN_MEMORY_TRAINING_MEMORY_GB`; deprecated shorter aliases are documented
# only in docs/CONFIGURATION.md.
#
# Unified-memory detection (Linux):
#   On a Linux host with an integrated AMD/Intel GPU, the BIOS-configured VRAM
#   carveout reported via /sys/class/drm/card*/device/mem_info_vram_total can far
#   exceed physical RAM (the GTT heap pages against system memory). When kiln
#   detects this — `mem_info_vram_total > MemTotal × 1.25`, OR a display
#   controller + integrated AMD/Intel vendor + GTT ≥ 1 GB — it corrects the
#   budget down to an automatically reserved fraction of physical memory so
#   training sized against this number cannot exhaust system RAM. The "GPU memory budget" log
#   line at startup includes a `vram_source = linux-drm-sysfs-unified` field so
#   the corrected value is honest about its provenance.
