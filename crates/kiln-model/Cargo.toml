[package]
name = "kiln-model"
description = "Model loading and inference runtime for Kiln"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
kiln-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
memmap2 = { workspace = true }
# (#1082) candle-core is fully dropped from kiln-model. The last activator
# was the `legacy-candle-parity` opt-in feature (candle-typed `for_device`
# shim + candle-bridge parity-oracle tests); both are gone, so no `cuda` /
# `metal` / `vulkan` build pulls candle. Tensor math is kt-native
# (`kiln_tensor`) end to end.
# Kernel-crate deps: default-features=false so a `--features rocm` build does NOT
# also pull each crate's default ["cuda"] (which would drag in cudarc). The
# `cuda` / `rocm` model features activate `<crate>/cuda` or `<crate>/rocm`
# explicitly. (R.4)
kiln-conv1d-kernel = { path = "../kiln-conv1d-kernel", optional = true, default-features = false }
kiln-flash-attn = { path = "../kiln-flash-attn", optional = true, default-features = false }
kiln-gdn-kernel = { path = "../kiln-gdn-kernel", optional = true, default-features = false }
kiln-marlin-gemm = { path = "../kiln-marlin-gemm", optional = true, default-features = false }
kiln-rmsnorm-kernel = { path = "../kiln-rmsnorm-kernel", optional = true, default-features = false }
kiln-vulkan-kernel = { workspace = true, optional = true }
# Bounded HIP runtime binding — pulled under the `rocm` feature. (R.4)
kiln-hip = { workspace = true, optional = true }
# Phase 6a/CP-4 (#1082): experimental tape-forward path under
# `KILN_USE_TAPE_FORWARD`. Optional so non-cuda builds don't pull in
# the autograd substrate; gated on `cuda` since the only kt-tape
# entry kiln-model can wire today
# (`fused_rmsnorm_via_kt_tape`) is CUDA-only.
kiln-autograd = { workspace = true, optional = true }
# Phase 7 migration adapter: pure `candle <-> kt` Device/DType enum
# mapping is always-on so the kt-typed Device/DType wrappers on
# kiln-model's public surface (`for_device_kt`, `device_kt`,
# `PagedKvCache::new_kt`, `GpuWeights::from_model_weights_kt`) compile
# on every build — kiln-server needs them in its multi-backend src/
# code regardless of CUDA. The kt-bridge `cuda` feature is forwarded
# under kiln-model's `cuda` to pull in the CudaStorage downcast +
# device-pointer helpers used by the model's CUDA fused-op call sites.
# (#1082)
kiln-kt-bridge = { path = "../kiln-kt-bridge", default-features = false }
# Direct dep so kiln-model can reference kiln_tensor types (Device,
# DType, Tensor) on its public surface. Multi-backend builds also need
# the base types; the `cuda` feature is forwarded under kiln-model's
# `cuda` to enable CUDA-specific kt-tensor code paths.
kiln-tensor = { workspace = true }
# Leaf crate that defines the kt-native `TensorId` used by
# `vk_forward.rs` for LoRA parameter ids (and by other Vk* call sites
# that previously imported candle's TensorId). Feature-gated under
# `vulkan` since only the vulkan path needs it today. (#1082)
kiln-tensor-id = { workspace = true, optional = true }
# Direct cudarc dep (#1082): the cudarc bindings re-exported via
# candle_core::cuda_backend::cudarc::* are pure pass-throughs to the
# cudarc crate. Importing them directly drops two
# `use candle_core::cuda_backend::cudarc::...` imports in
# paged_kv_cache_kt.rs without changing any runtime behavior. The
# version is pinned in the workspace to match what candle-core 0.10
# vendors so types unify across the dep graph (same pattern landed in
# kiln-tensor commit 4ee1b7f9 and kiln-blas commit 0d201199).
cudarc = { workspace = true, optional = true }
kiln-nvtx = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
indicatif = "0.18"
console = "0.16"
half = { version = "2", optional = true }
bytemuck = { version = "1", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }


[features]
cuda = ["dep:cudarc", "kiln-conv1d-kernel/cuda", "kiln-flash-attn/cuda", "kiln-gdn-kernel/cuda", "kiln-marlin-gemm/cuda", "kiln-rmsnorm-kernel/cuda", "dep:kiln-tensor-id", "kiln-kt-bridge/cuda", "kiln-tensor/cuda", "dep:half", "dep:bytemuck", "dep:kiln-autograd"]
# ROCm backend (R.4) — mirrors `cuda`, swapping cudarc->kiln-hip and each kernel
# crate's `/cuda` feature for `/rocm`. The kernel _kt entry points are
# backend-neutral (dispatch on Device::Rocm); backend/rocm.rs is the model-side
# backend impl.
rocm = ["dep:kiln-hip", "kiln-conv1d-kernel/rocm", "kiln-flash-attn/rocm", "kiln-gdn-kernel/rocm", "kiln-marlin-gemm/rocm", "kiln-rmsnorm-kernel/rocm", "dep:kiln-tensor-id", "kiln-kt-bridge/rocm", "kiln-tensor/rocm", "dep:half", "dep:bytemuck", "dep:kiln-autograd"]
# Metal backend on Apple Silicon — fully candle-free (#1082). Every compute
# kernel is kiln-owned MSL (kiln-tensor `crate::metal_rt`), production attention
# runs `metal_sdpa_last_axis`, and the queue sync is the kt-native
# `primary_metal_companion(idx).wait_until_completed()`. The candle-typed
# `for_device` shim + candle-Tensor interop tests were deleted with the
# candle-parity opt-in feature (#1082), so `--features metal` pulls no candle.
# `dep:kiln-autograd` is pulled for the kt-tape-authoritative training path —
# SFT/GRPO/OPD on Metal record on the kt autograd tape (#1082 metal-training).
metal = ["kiln-kt-bridge/metal", "dep:objc2", "dep:objc2-metal", "kiln-tensor/metal", "dep:kiln-autograd", "dep:half"]
# Emit NVTX ranges around the hot paths in `forward.rs` so nsys can attribute
# kernel time per call site. Off by default; pulls in kiln-nvtx's libnvToolsExt
# link line. Pair with `--features cuda,nvtx`.
nvtx = ["kiln-nvtx/nvtx"]
# Enable Vulkan backend for AMD/Intel GPUs. Uses vulkan-rs with GLSL compute
# shaders compiled to SPIR-V at build time. candle-core has no native Vulkan
# device, so the Vulkan backend manages its own vk::Device and copies tensor
# data through the CPU path at kernel boundaries.
vulkan = ["dep:kiln-vulkan-kernel", "dep:kiln-tensor-id", "kiln-core/vulkan", "dep:half", "dep:bytemuck", "dep:kiln-autograd", "kiln-tensor/vulkan", "kiln-kt-bridge/vulkan"]

[dev-dependencies]
tempfile = { workspace = true }
