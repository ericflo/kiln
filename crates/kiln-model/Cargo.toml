[package]
name = "kiln-model"
description = "Model loading and inference runtime for Kiln"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
kiln-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
memmap2 = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-metal-kernels = { version = "0.10", optional = true }
kiln-conv1d-kernel = { workspace = true, optional = true }
kiln-flash-attn = { workspace = true, optional = true }
kiln-gdn-kernel = { workspace = true, optional = true }
kiln-marlin-gemm = { workspace = true, optional = true }
kiln-rmsnorm-kernel = { workspace = true, optional = true }
kiln-vulkan-kernel = { workspace = true, optional = true }
# Phase 7 migration adapter: pure `candle <-> kt` Device/DType enum
# mapping is always-on so the kt-typed Device/DType wrappers on
# kiln-model's public surface (`for_device_kt`, `device_kt`,
# `PagedKvCache::new_kt`, `GpuWeights::from_model_weights_kt`) compile
# on every build — kiln-server needs them in its multi-backend src/
# code regardless of CUDA. The kt-bridge `cuda` feature is forwarded
# under kiln-model's `cuda` to pull in the CudaStorage downcast +
# device-pointer helpers used by the model's CUDA fused-op call sites.
# (#1082)
kiln-kt-bridge = { workspace = true }
# Direct dep so kiln-model can reference kiln_tensor types (Device,
# DType, Tensor) on its public surface. Multi-backend builds also need
# the base types; the `cuda` feature is forwarded under kiln-model's
# `cuda` to enable CUDA-specific kt-tensor code paths.
kiln-tensor = { workspace = true }
# Leaf crate that defines the kt-native `TensorId` used by
# `vk_forward.rs` for LoRA parameter ids (and by other Vk* call sites
# that previously imported candle's TensorId). Feature-gated under
# `vulkan` since only the vulkan path needs it today. (#1082)
kiln-tensor-id = { workspace = true, optional = true }
# Direct cudarc dep (#1082): the cudarc bindings re-exported via
# candle_core::cuda_backend::cudarc::* are pure pass-throughs to the
# cudarc crate. Importing them directly drops two
# `use candle_core::cuda_backend::cudarc::...` imports in
# paged_kv_cache_kt.rs without changing any runtime behavior. The
# version is pinned in the workspace to match what candle-core 0.10
# vendors so types unify across the dep graph (same pattern landed in
# kiln-tensor commit 4ee1b7f9 and kiln-blas commit 0d201199).
cudarc = { workspace = true, optional = true }
kiln-nvtx = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
indicatif = "0.18"
console = "0.16"
half = { version = "2", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }


[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:cudarc", "dep:kiln-conv1d-kernel", "dep:kiln-flash-attn", "dep:kiln-gdn-kernel", "dep:kiln-marlin-gemm", "dep:kiln-rmsnorm-kernel", "dep:kiln-tensor-id", "kiln-kt-bridge/cuda", "kiln-tensor/cuda", "dep:half"]
# Phase 7 (#1082): opt-in feature to compile the candle-typed GDN
# parity tests in forward.rs against `kiln_gdn_kernel::gdn_chunk_*`
# / `gdn_full_chunk_forward*`. Production decode goes through the
# kt-typed surface; these tests exist to validate kernel changes
# against the candle reference. Enable with
# `--features cuda,legacy-candle-parity`.
legacy-candle-parity = []
# Enable candle's Metal backend on Apple Silicon. Pulls in candle-metal-kernels
# (JIT-compiled MSL shaders cached in the MetalDevice); no Xcode required.
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2", "dep:objc2-metal", "kiln-tensor/metal"]
# Emit NVTX ranges around the hot paths in `forward.rs` so nsys can attribute
# kernel time per call site. Off by default; pulls in kiln-nvtx's libnvToolsExt
# link line. Pair with `--features cuda,nvtx`.
nvtx = ["kiln-nvtx/nvtx"]
# Enable Vulkan backend for AMD/Intel GPUs. Uses vulkan-rs with GLSL compute
# shaders compiled to SPIR-V at build time. candle-core has no native Vulkan
# device, so the Vulkan backend manages its own vk::Device and copies tensor
# data through the CPU path at kernel boundaries.
vulkan = ["dep:kiln-vulkan-kernel", "dep:kiln-tensor-id", "kiln-core/vulkan"]

[dev-dependencies]
tempfile = { workspace = true }
