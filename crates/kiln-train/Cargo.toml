[package]
name = "kiln-train"
description = "In-process LoRA training for Kiln — pure Rust, no Python sidecar"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
# CP-4 substrate dep — pulled in for `crate::tape_step`, the first
# `kiln_autograd::Tape`-based training entry in this crate. The
# production trainer in `crate::trainer` still drives candle's
# `loss.backward()`; the kt-tape entry sits alongside it as the
# substrate proof point that future PRs extend to cover the full
# per-step graph. See `crates/kiln-train/src/tape_step.rs` module
# docstring + `docs/rmsnorm-kt-tape-production-caller-stop-2026-05-28.md`
# for the full CP-4 rationale. (#1082)
kiln-autograd = { workspace = true }
kiln-core = { workspace = true }
kiln-memory = { workspace = true }
kiln-eval = { workspace = true }
kiln-flce-kernel = { workspace = true }
kiln-rmsnorm-kernel = { workspace = true }
# CP-4 (#1082): the `kiln_kt_bridge::tape_bridge` module owns the
# `with_tape_scope_emit_to_grad_store` wrapper that merges
# `kiln_autograd::Tape`-recorded backward grads into the candle
# `GradStore` produced by `loss.backward()`. The wrapper is the
# CUDA-only `kiln-kt-bridge/cuda` feature; the default CPU/Metal/Vulkan
# build of `kiln-train` does not need the bridge (the wrapper is
# called only behind `#[cfg(feature = "cuda")]` in `trainer.rs`).
kiln-kt-bridge = { path = "../kiln-kt-bridge", default-features = false }
kiln-model = { workspace = true }
kiln-opd-loss-kernel = { workspace = true }
kiln-tensor = { workspace = true }
# Leaf crate that defines the kt-native `TensorId` (wraps `u64`).
# Pulled in unconditionally (no longer `optional = true` /
# `vulkan`-gated) so the `cd_types::KtTensorId` alias + the
# `cd_tensor_id_to_kt` conversion shim are available to every build
# profile. This is the substrate PR for the
# `cd_types::TensorId (= candle_core::TensorId)` →
# `kiln_tensor_id::TensorId` migration tracked in
# `docs/kiln-train-candle-core-deps-still-required-2026-05-28.md`. The
# crate is dependency-free (see `crates/kiln-tensor-id/Cargo.toml`), so
# pulling it into the default build adds no transitive cost.
# `vk_train.rs` continues to import the symbol from
# `kiln_tensor_id::TensorId` directly under the `vulkan` feature, which
# now resolves through this unconditional dep instead of a feature
# enable. (#1082)
kiln-tensor-id = { workspace = true }
# (#1082) kt-native parameter + optimizer crates. `kiln-param` provides
# `Parameter` (one logical param, one stable kt `TensorId`, BF16/F32
# master + LoRA-A/B forward storage) and `kiln-optim` provides the
# `OptimStep` trait + `AdamW` (moments keyed by `Parameter::tensor_id()`).
# Together they replace the candle `Var` + `AdamWMoments{m,v:Var}` +
# `OptimizerState` machinery that drove the trainer's LoRA params on the
# candle `loss.backward()` path. The trainer now threads each
# `Parameter`'s primary kt tensor into the kt tape forward, so backward
# yields a grad keyed by `Parameter::tensor_id()`.
kiln-param = { workspace = true }
kiln-optim = { workspace = true }
# candle-core dropped from the cuda lane (#1082): kiln-train src + tests are
# candle-code-free (the cuda+vulkan parity test pulls candle via kiln-model).
# `candle-nn` is dev-only now: the last production caller
# (`build_local_teacher_fixture` log_softmax) was inlined in commit
# 35ad29e6; the only remaining refs are in
# `opd::opd_train_synthetic_validation` which is `#[cfg(test)]`. (#1082)
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
indicatif = "0.18"
console = "0.16"
sha2 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing-subscriber = { workspace = true }

[features]
cuda = ["kiln-model/cuda", "kiln-flce-kernel/cuda", "kiln-rmsnorm-kernel/cuda", "kiln-opd-loss-kernel/cuda", "kiln-kt-bridge/cuda"]
# ROCm backend (R.4) — mirrors `cuda`.
rocm = ["kiln-model/rocm", "kiln-flce-kernel/rocm", "kiln-rmsnorm-kernel/rocm", "kiln-opd-loss-kernel/rocm", "kiln-kt-bridge/rocm"]
metal = ["kiln-model/metal", "kiln-kt-bridge/metal", "kiln-opd-loss-kernel/metal"]
vulkan = ["kiln-model/vulkan", "dep:kiln-vulkan-kernel", "kiln-opd-loss-kernel/vulkan", "kiln-kt-bridge/vulkan"]

[dependencies.kiln-vulkan-kernel]
workspace = true
optional = true

[dev-dependencies]
# (#1082 candle-drop) `candle-nn` dev-dep removed: its sole user
# (`opd::opd_train_synthetic_validation`, `#[cfg(test)]`, which drove the
# synthetic-data convergence check via `candle_nn::optim::AdamW` +
# `Optimizer::backward_step`) was deleted along with the OPD candle grad
# path. No `candle_nn::` reference remains in the crate.
# Test-only: `inject_gradient_parity` (cfg(test) + #[cfg(feature = "cuda")])
# uses `half::bf16::from_f32` to build deterministic bf16 fixtures for
# the candle ⟷ kt-tape parity assertion (substrate landed in 9b2eda8e;
# the dev-dep wasn't added at the time and the cuda-gated test was
# never exercised by a CUDA-less CI). Pinned to "2" to match the rest
# of the workspace's `half` deps. (#1082)
half = "2"

[[bin]]
name = "kiln-replay"
path = "src/bin/kiln-replay.rs"
