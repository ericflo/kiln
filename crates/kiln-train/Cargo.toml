[package]
name = "kiln-train"
description = "In-process LoRA training for Kiln — pure Rust, no Python sidecar"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
kiln-core = { workspace = true }
kiln-eval = { workspace = true }
kiln-flce-kernel = { workspace = true }
kiln-model = { workspace = true }
kiln-opd-loss-kernel = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
indicatif = "0.18"
console = "0.16"
sha2 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"

[features]
cuda = ["kiln-model/cuda", "kiln-flce-kernel/cuda", "kiln-opd-loss-kernel/cuda"]
metal = ["kiln-model/metal"]
vulkan = ["kiln-model/vulkan", "dep:kiln-vulkan-kernel"]

[dependencies.kiln-vulkan-kernel]
workspace = true
optional = true

[[bin]]
name = "kiln-replay"
path = "src/bin/kiln-replay.rs"
