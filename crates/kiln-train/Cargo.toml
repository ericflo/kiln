[package]
name = "kiln-train"
description = "In-process LoRA training for Kiln — pure Rust, no Python sidecar"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
# CP-4 substrate dep — pulled in for `crate::tape_step`, the first
# `kiln_autograd::Tape`-based training entry in this crate. The
# production trainer in `crate::trainer` still drives candle's
# `loss.backward()`; the kt-tape entry sits alongside it as the
# substrate proof point that future PRs extend to cover the full
# per-step graph. See `crates/kiln-train/src/tape_step.rs` module
# docstring + `docs/rmsnorm-kt-tape-production-caller-stop-2026-05-28.md`
# for the full CP-4 rationale. (#1082)
kiln-autograd = { workspace = true }
kiln-core = { workspace = true }
kiln-eval = { workspace = true }
kiln-flce-kernel = { workspace = true }
# CP-4 (#1082): the `kiln_kt_bridge::tape_bridge` module owns the
# `with_tape_scope_emit_to_grad_store` wrapper that merges
# `kiln_autograd::Tape`-recorded backward grads into the candle
# `GradStore` produced by `loss.backward()`. The wrapper is the
# CUDA-only `kiln-kt-bridge/cuda` feature; the default CPU/Metal/Vulkan
# build of `kiln-train` does not need the bridge (the wrapper is
# called only behind `#[cfg(feature = "cuda")]` in `trainer.rs`).
kiln-kt-bridge = { workspace = true }
kiln-model = { workspace = true }
kiln-opd-loss-kernel = { workspace = true }
kiln-tensor = { workspace = true }
# Leaf crate that defines the kt-native `TensorId` used by
# `vk_train.rs` for LoRA / boundary-leaf parameter ids. Feature-gated
# under `vulkan` since only the vulkan path needs it today. (#1082)
kiln-tensor-id = { workspace = true, optional = true }
candle-core = { workspace = true }
# `candle-nn` is dev-only now: the last production caller
# (`build_local_teacher_fixture` log_softmax) was inlined in commit
# 35ad29e6; the only remaining refs are in
# `opd::opd_train_synthetic_validation` which is `#[cfg(test)]`. (#1082)
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
indicatif = "0.18"
console = "0.16"
sha2 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing-subscriber = { workspace = true }

[features]
cuda = ["kiln-model/cuda", "kiln-flce-kernel/cuda", "kiln-opd-loss-kernel/cuda", "kiln-kt-bridge/cuda"]
metal = ["kiln-model/metal"]
vulkan = ["kiln-model/vulkan", "dep:kiln-vulkan-kernel", "dep:kiln-tensor-id"]

[dependencies.kiln-vulkan-kernel]
workspace = true
optional = true

[dev-dependencies]
# Test-only: `opd::opd_train_synthetic_validation` (cfg(test)) uses
# `candle_nn::optim::AdamW` + `Optimizer::backward_step` to drive the
# synthetic-data convergence check. Production code is candle_nn-free
# (log_softmax was inlined in 35ad29e6). (#1082)
candle-nn = { workspace = true }

[[bin]]
name = "kiln-replay"
path = "src/bin/kiln-replay.rs"
