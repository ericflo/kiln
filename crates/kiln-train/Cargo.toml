[package]
name = "kiln-train"
description = "In-process LoRA training for Kiln — pure Rust, no Python sidecar"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
# CP-4 substrate dep — first pulled in for `crate::tape_step`, the
# first `kiln_autograd::Tape`-based training entry in this crate. The kt
# tape has since become the production trainer's grad producer (the #1082
# candle drop removed the candle `loss.backward()` path). See
# `crates/kiln-train/src/tape_step.rs` module
# docstring + `docs/archive/candle-removal/rmsnorm-kt-tape-production-caller-stop-2026-05-28.md`
# for the full CP-4 rationale. (#1082)
kiln-autograd = { workspace = true }
kiln-core = { workspace = true }
kiln-memory = { workspace = true }
kiln-eval = { workspace = true }
kiln-resource = { workspace = true }
kiln-flce-kernel = { workspace = true }
kiln-rmsnorm-kernel = { workspace = true }
# CP-4 (#1082): the `kiln_kt_bridge::tape_bridge` module provides the
# tape-authoritative scopes this crate drives backward through —
# `with_tape_authoritative_scope_kt` + `with_tape_segment_backward_scope` —
# plus the kt-param deposit encode/decode (`register_input_mapping_kt` /
# `decode_kt_param_deposit`) the kt grad producers read tape grads back
# with.
kiln-kt-bridge = { path = "../kiln-kt-bridge", default-features = false }
kiln-model = { workspace = true }
kiln-opd-loss-kernel = { workspace = true }
kiln-tensor = { workspace = true }
# Leaf crate that defines the kt-native `TensorId` (wraps `u64`).
# Pulled in unconditionally (no longer `optional = true` /
# `vulkan`-gated) so the `cd_types::TensorId` alias is available to
# every build profile. This is the substrate PR for the
# `cd_types::TensorId (= candle_core::TensorId)` →
# `kiln_tensor_id::TensorId` migration tracked in
# `docs/archive/candle-removal/kiln-train-candle-core-deps-still-required-2026-05-28.md`. The
# crate is dependency-free (see `crates/kiln-tensor-id/Cargo.toml`), so
# pulling it into the default build adds no transitive cost. (#1082)
kiln-tensor-id = { workspace = true }
# (#1082) kt-native parameter + optimizer crates. `kiln-param` provides
# `Parameter` (one logical param, one stable kt `TensorId`, BF16/F32
# master + LoRA-A/B forward storage) and `kiln-optim` provides the
# `OptimStep` trait + `AdamW` (moments keyed by `Parameter::tensor_id()`).
# Together they replace the candle `Var` + `AdamWMoments{m,v:Var}` +
# `OptimizerState` machinery that drove the trainer's LoRA params on the
# candle `loss.backward()` path. The trainer now threads each
# `Parameter`'s primary kt tensor into the kt tape forward, so backward
# yields a grad keyed by `Parameter::tensor_id()`.
kiln-param = { workspace = true }
kiln-optim = { workspace = true }
# candle-core dropped from the cuda lane (#1082): kiln-train src + tests are
# candle-code-free (the cuda+vulkan parity test pulls candle via kiln-model).
# The last candle-nn users (`build_local_teacher_fixture` log_softmax, then
# `opd::opd_train_synthetic_validation`) were deleted in the candle drop —
# see the [dev-dependencies] note below. (#1082)
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
uuid = { workspace = true }
chrono = { workspace = true }
indicatif = "0.18"
console = "0.16"
sha2 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

[features]
cuda = ["kiln-model/cuda", "kiln-flce-kernel/cuda", "kiln-rmsnorm-kernel/cuda", "kiln-opd-loss-kernel/cuda", "kiln-kt-bridge/cuda"]
# ROCm backend (R.4) — mirrors `cuda`.
rocm = ["kiln-model/rocm", "kiln-flce-kernel/rocm", "kiln-rmsnorm-kernel/rocm", "kiln-opd-loss-kernel/rocm", "kiln-kt-bridge/rocm"]
metal = ["kiln-model/metal", "kiln-kt-bridge/metal", "kiln-opd-loss-kernel/metal"]
vulkan = ["kiln-model/vulkan", "dep:kiln-vulkan-kernel", "kiln-opd-loss-kernel/vulkan", "kiln-kt-bridge/vulkan"]

[dependencies.kiln-vulkan-kernel]
workspace = true
optional = true

[dev-dependencies]
# (#1082 candle-drop) `candle-nn` dev-dep removed: its sole user
# (`opd::opd_train_synthetic_validation`, `#[cfg(test)]`, which drove the
# synthetic-data convergence check via `candle_nn::optim::AdamW` +
# `Optimizer::backward_step`) was deleted along with the OPD candle grad
# path. No `candle_nn::` reference remains in the crate.

[[bin]]
name = "kiln-replay"
path = "src/bin/kiln-replay.rs"
