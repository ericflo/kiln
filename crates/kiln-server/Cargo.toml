[package]
name = "kiln-server"
description = "HTTP server for Kiln — OpenAI-compatible inference + training API"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[lib]
name = "kiln_server"
path = "src/lib.rs"

[[bin]]
name = "kiln"
path = "src/main.rs"

[[bin]]
name = "kiln-bench"
path = "src/bench.rs"

[[bin]]
name = "kiln-eval"
path = "src/bin/kiln_eval_cli.rs"

# These three examples drive the CUDA fused-op call sites end-to-end,
# so they require --features cuda. The kt-typed entries on
# kiln-model's public surface (GpuWeights::from_model_weights_kt, etc.)
# themselves are available on every build now — the cuda gate here is
# about the model-loading + CUDA-only fused-op chain the benches run.
[[example]]
name = "flce_phase_a_validation_bench"
path = "examples/flce_phase_a_validation_bench.rs"
required-features = ["cuda"]

[[example]]
name = "flce_preflight_bench"
path = "examples/flce_preflight_bench.rs"
required-features = ["cuda"]

[[example]]
name = "phase10_rmsnorm_bench"
path = "examples/phase10_rmsnorm_bench.rs"
required-features = ["cuda"]

[dependencies]
kiln-core = { workspace = true }
kiln-memory = { workspace = true }
kiln-eval = { workspace = true }
kiln-model = { workspace = true }
kiln-resource = { workspace = true }
kiln-scheduler = { workspace = true }
kiln-tensor = { workspace = true }
# Pure `candle <-> kt` Device/DType enum-mapping helpers are
# always-on so the multi-backend src/ code (Linux/default,
# Linux/Vulkan, macOS/Metal) can call the kt-typed entries on
# kiln-model's public surface (`for_device_kt`, `device_kt`,
# `PagedKvCache::new_kt`, `GpuWeights::from_model_weights_kt`)
# without a CUDA toolchain. The `cuda` feature is forwarded under
# kiln-server's `cuda` to pull in the CUDA-specific helpers. (#1082)
kiln-kt-bridge = { path = "../kiln-kt-bridge", default-features = false }
kiln-train = { workspace = true }
axum = { workspace = true }
socket2 = { workspace = true }
portable-pty = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
console = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# Used to refresh the mtime of composed-adapter cache directories on cache
# hit so LRU eviction sees them as recently used. Already pulled in
# transitively by `tar`, but we depend on it directly to make the use
# explicit.
filetime = "0.2"
sha2 = { workspace = true }
regex = "1"

[features]
cuda = ["kiln-model/cuda", "kiln-tensor/cuda", "kiln-train/cuda", "kiln-kt-bridge/cuda"]
# ROCm backend (R.4) — mirrors `cuda`. Adds Device::Rocm selection in
# kiln-server's device.rs (R.9 wires the runtime probe).
rocm = ["kiln-model/rocm", "kiln-tensor/rocm", "kiln-train/rocm", "kiln-kt-bridge/rocm"]
metal = ["kiln-model/metal", "kiln-tensor/metal", "kiln-kt-bridge/metal", "kiln-train/metal"]
vulkan = ["kiln-model/vulkan", "kiln-tensor/vulkan", "kiln-train/vulkan", "kiln-kt-bridge/vulkan"]
# Forward kiln-model's NVTX feature so kiln-bench / kiln binaries emit ranges
# under nsys for per-call-site attribution. No effect without --features cuda.
nvtx = ["kiln-model/nvtx"]

[dev-dependencies]
tempfile = { workspace = true }
safetensors = { workspace = true }
# (#1082) candle-core dev-dep dropped: kiln-server has zero candle code — src
# and tests are kt-typed (`real_model_integration::tiny_weights` builds kt
# Tensors directly; the candle bridge was removed when GpuWeights went
# kt-typed). Makes kiln-server fully candle-free (runtime + dev); verified by
# `cargo tree -p kiln-server --features cuda -i candle-core` → empty.
tower = { workspace = true, features = ["util"] }
# Integration tests use filetime to pre-age fake composed-cache entries so
# LRU eviction order is deterministic.
filetime = "0.2"
# Used in chat-template integration tests to construct a stand-in tokenizer
# from a minimal in-memory vocab JSON before applying the chat template.
tokenizers = { workspace = true }
