[package]
name = "kiln-conv1d-kernel"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vendored mamba-ssm causal_conv1d_update CUDA kernel (decode-only, bf16, kernel_size=4) with C-ABI wrapper"
build = "build.rs"

[dependencies]
half = "2"
# Phase 7 (#1082) — kt-only crate, no candle dep.
kiln-tensor = { workspace = true, features = ["cuda"] }
kiln-kt-bridge = { path = "../kiln-kt-bridge", default-features = false, features = ["cuda"] }

[build-dependencies]
cc = "1"
