[package]
name = "kiln-conv1d-kernel"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vendored mamba-ssm causal_conv1d_update CUDA kernel (decode-only, bf16, kernel_size=4) with C-ABI wrapper"
build = "build.rs"

[dependencies]
candle-core = { workspace = true, features = ["cuda"] }
half = "2"
# Phase 7 prep — kiln-tensor-typed surface alongside candle-typed.
# Both call the same FFI; Phase 7 deletes the candle path.
kiln-tensor = { workspace = true, features = ["cuda"] }

[build-dependencies]
cc = "1"
