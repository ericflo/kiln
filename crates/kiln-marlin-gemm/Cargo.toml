[package]
name = "kiln-marlin-gemm"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vendored IST-DASLab/marlin W4A16 GEMM CUDA kernel with a thin BF16 C-ABI wrapper"
build = "build.rs"

[features]
# Default to the historical CUDA build so existing `cargo build -p
# kiln-marlin-gemm` invocations keep their behavior.
default = ["cuda"]
# CUDA backend — compiles csrc/marlin_kernel.cu with nvcc (inline mma.sync PTX)
# and routes the kt wrapper through kiln-tensor/kiln-kt-bridge's cuda
# device-pointer seam.
cuda = ["kiln-tensor/cuda", "kiln-kt-bridge/cuda"]
# ROCm backend (Phase R.8) — Marlin's CUDA path is inline `mma.sync` PTX that
# cannot be hipified, so the ROCm lane ships a correctness-first composite:
# dequantize the packed int4 weights to f16 on the host, upload to the device,
# then call `kiln_tensor::rocm_matmul`. No `.cu` is compiled under this feature
# (the unpack is pure host index math). Native MFMA/WMMA Marlin is the R.10
# follow-up.
rocm = ["kiln-tensor/rocm", "kiln-kt-bridge/rocm"]

[dependencies]
half = "2"
# Phase 7 (#1082) — kt-only crate, no candle dep. The backend (cuda/rocm) is
# selected via this crate's matching feature so a single source tree builds on
# either GPU stack.
kiln-tensor = { workspace = true }
kiln-kt-bridge = { path = "../kiln-kt-bridge", default-features = false }

[build-dependencies]
cc = "1"
