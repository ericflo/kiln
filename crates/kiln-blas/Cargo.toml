[package]
name = "kiln-blas"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kiln-tensor's CUDA BLAS layer (cublasLt). Phase 2.1 ships backend-agnostic types; Phase 2.x adds the cublasLt MatmulHandle."
build = "build.rs"

# Phase 2.1 splits this crate into three layers:
#
# - **Backend-agnostic types** (AlgoCache + WorkspacePool + BackendMatmul
#   trait + Epilogue + MatmulRequest) — compile on every host without
#   `--features probe` or `--features cublaslt`.
# - **Probe FFI + cublasLt baseline** — gated behind `--features probe`.
#   Pulls cudarc directly for the driver-side types; the actual probe
#   numerics live in C/CUDA (`csrc/cublaslt_probe.cu`).
# - **CublasLtMatmulHandle** — gated behind `--features cublaslt`. The
#   production matmul executor that lifts the probe into a reusable
#   handle with workspace pool + algo cache integration.
#
# #1082: this crate no longer depends on `candle-core`. The previous
# rationale for keeping candle around was "shared cudarc vendor"; now
# that the workspace pins `cudarc` directly at the same version every
# crate uses, candle-core is dead weight here and is gone.

[features]
default = []
# Builds the cublasLt probe binary. Pulls cudarc directly + triggers the
# build.rs cublasLt link.
probe = ["dep:cudarc"]
# Builds the production `CublasLtMatmulHandle` (cublasLt context +
# matmul executor). Pulls cudarc directly for the driver types
# (`CudaContext`, `CudaSlice`, `CUstream`, `DevicePtr`). Issue #1082
# completed the candle removal.
cublaslt = ["dep:cudarc"]

[dependencies]
# Direct cudarc — the sole CUDA substrate dependency. Pinned by the
# workspace so the compiled crate unifies with every other kiln crate
# that holds a `CudaContext` / `CudaSlice<u8>`.
cudarc = { workspace = true, optional = true }
half = "2"

# Timing + JSON output.
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"

# The probe example links the cublasLt FFI under `--features probe`.
# Mark required-features so plain `cargo build` / `cargo test` on hosts
# without a CUDA toolchain don't try to compile it.
[[example]]
name = "cublaslt_mlp_probe"
required-features = ["probe"]
