[package]
name = "kiln-opd-loss-kernel"
description = "Fused top-K reverse-KL loss for On-Policy Distillation (OPD) — gathers student logits at teacher's top-K support indices, renormalises both sides, computes per-token reverse KL + gradient w.r.t. student hidden states without materialising the full [T, V] logits tensor. Phase 7 prep: kt-typed parallel surface (see `kt_api`)."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[build-dependencies]
cc = "1"

[dependencies]
candle-core = { workspace = true }
# kt-typed parallel surface (see `kt_api`). The forward path is pure
# kt-tensor ops; the backward kt entry point
# (`opd_top_k_reverse_kl_phase_b_bwd_kt`) wraps the same CUDA FFI
# symbols as the candle path (`kiln_opd_topk_kl_bwd_*`), routing
# through `kiln-kt-bridge` for storage downcast + device-pointer
# extraction. CUDA-only on the backward; gated by the `cuda` feature.
kiln-tensor = { workspace = true }
# Phase 6a/CP-4 (#1082): kt-tape parallel surface (see `kt_tape`). The
# kt-tape entry records the OPD Phase-B fused backward directly onto a
# `kiln_autograd::Tape`, dropping the candle `CustomOp1` wrapper used by
# `kt_forward_op`. Same FFI symbols as the candle path on the backward.
# Always-on dep — the kt-tape module compiles on every build; the
# `apply()` body is gated under the `cuda` feature.
kiln-autograd = { workspace = true }
# Optional: only used by the CUDA backward bridge path
# (`opd_top_k_reverse_kl_phase_b_bwd_kt`) which itself is
# `#[cfg(feature = "cuda")]`. Pulling it in unconditionally drags
# `cudarc` into non-CUDA CI matrix jobs (Linux/default,
# Linux/Vulkan, macOS/Metal), which fail at the `nvcc --version`
# probe in cudarc's build.rs. Gated under the `cuda` feature
# along with `candle-core/cuda` + `kiln-tensor/cuda`.
kiln-kt-bridge = { workspace = true, optional = true }
anyhow = { workspace = true }
half = "2"
# `tracing` for the warn-on-fallback path in cuda_fwd. Cheap dep and
# already pulled in by every consumer of kiln-train.
tracing = { workspace = true }

[features]
# Activates the raw-CUDA forward/backward path in `cuda_fwd`/`bwd`. Without
# this feature the CUDA path routes through the candle reference path on
# CUDA storage (correct but slower). kiln-train re-exports this feature via
# its own `cuda` feature so `cargo build --features cuda` activates it.
#
# Milestone 1 (this commit): the `cuda` feature only enables the candle-on-CUDA
# reference path; a raw-CUDA C-ABI kernel + `build.rs` lands in the next
# milestone (see `docs/plans/grand-plan-for-extraordinarily-great-on-policy-distillation-for-everyone.md`
# §9.2). The CPU reference path is the parity oracle.
cuda = ["candle-core/cuda", "kiln-tensor/cuda", "dep:kiln-kt-bridge", "kiln-kt-bridge?/cuda"]
