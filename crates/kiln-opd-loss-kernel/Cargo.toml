[package]
name = "kiln-opd-loss-kernel"
description = "Fused top-K reverse-KL loss for On-Policy Distillation (OPD) — gathers student logits at teacher's top-K support indices, renormalises both sides, computes per-token reverse KL + gradient w.r.t. student hidden states without materialising the full [T, V] logits tensor. Phase 7 prep: kt-typed parallel surface (see `kt_api`)."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[build-dependencies]
cc = "1"

[dependencies]
# (#1082) candle-drop: this crate is now 100% candle-free (the first
# kernel-crate candle drop). The candle-typed glue (Phase A reference,
# the `CustomOp1` kt-forward-op shim, the kt-tape production-caller
# adapters) moved UP into `kiln-train::opd_candle_shim`, which keeps
# candle. `candle-core`, `anyhow`, and `tracing` were the deps those
# moved paths needed; with them gone the kept code (`kt_api`, `kt_tape`,
# `phase_b`, `lib.rs`) is pure `kiln_tensor` + `kiln_autograd`.
#
# kt-typed parallel surface (see `kt_api`). The forward path is pure
# kt-tensor ops; the backward kt entry point
# (`opd_top_k_reverse_kl_phase_b_bwd_kt`) wraps the CUDA FFI symbols
# `kiln_opd_topk_kl_bwd_*`, routing through `kiln-kt-bridge` for storage
# downcast + device-pointer extraction. CUDA-only on the backward; gated
# by the `cuda` feature.
kiln-tensor = { workspace = true }
# Phase 6a/CP-4 (#1082): kt-tape parallel surface (see `kt_tape`). The
# kt-tape entry records the OPD Phase-B fused backward directly onto a
# `kiln_autograd::Tape`. Same FFI symbols on the backward. Always-on dep
# — the kt-tape module compiles on every build; the `apply()` body is
# gated under the `cuda` feature.
kiln-autograd = { workspace = true }
# Optional: only used by the CUDA backward bridge path
# (`opd_top_k_reverse_kl_phase_b_bwd_kt`) which itself is
# `#[cfg(feature = "cuda")]`. Pulling it in unconditionally drags
# `cudarc` into non-CUDA CI matrix jobs (Linux/default,
# Linux/Vulkan, macOS/Metal), which fail at the `nvcc --version`
# probe in cudarc's build.rs. Gated under the `cuda` feature
# along with `kiln-tensor/cuda`.
#
# (#1082) candle-drop: `default-features = false` opts OUT of
# kt-bridge's now-optional `candle` feature. This crate uses ONLY the
# kt-native bridge surface (BridgeError + alloc_cuda_tensor +
# cuda_input_device_ptr + cuda_output_device_ptr +
# cuda_storage_and_byte_offset — see `kt_api.rs`), none of which touch
# candle. With this opt-out, `cargo tree -p kiln-opd-loss-kernel
# --features cuda` is candle-free, completing this crate's candle drop
# at the dependency-graph level too. Every OTHER kt-bridge consumer
# keeps the default (candle-on), so the blast radius is contained.
# NOTE: declared as a DIRECT path dep (not `workspace = true`) because Cargo
# forbids a member overriding `default-features = false` on a workspace-inherited
# dependency. This is the only crate that opts out of kt-bridge's candle feature.
kiln-kt-bridge = { path = "../kiln-kt-bridge", optional = true, default-features = false }
half = "2"

[features]
# Activates the raw-CUDA fused backward path in the kt entry
# (`opd_top_k_reverse_kl_phase_b_bwd_kt`) + the kt-tape `apply()` body.
# Without this feature the kt-typed surface compiles but the CUDA-only
# backward dispatch is gated out. kiln-train re-exports this feature via
# its own `cuda` feature so `cargo build --features cuda` activates it.
#
# (#1082) Enables `kiln-kt-bridge?/cuda` (the candle-free CUDA helpers)
# but deliberately NOT `kiln-kt-bridge?/candle`, so the kt-bridge
# pulled in here stays candle-free.
cuda = ["kiln-tensor/cuda", "dep:kiln-kt-bridge", "kiln-kt-bridge?/cuda"]

# (#1082 Metal lane) Compiles the kt-native OPD forward / loss surface
# (`kt_api`, `kt_tape`) on Metal storage. Forwards `kiln-tensor/metal`
# ONLY — the fused backward kernel (`kiln_opd_topk_kl_bwd_{f32,bf16}` in
# `phase_b.rs` / the `opd_top_k_reverse_kl_phase_b_bwd_kt` dispatch in
# `kt_api.rs`) is genuine CUDA FFI with NO device-agnostic kt path, so it
# stays gated behind `cuda` and is deliberately NOT pulled in here. With
# only `metal`, the kt-tape backward `apply()` body takes the
# `#[cfg(not(feature = "cuda"))]` arm and `bail!`s — i.e. OPD forward +
# loss are reachable on Metal, but the OPD backward (LoRA grad) is a
# documented follow-up pending a Metal OPD top-K reverse-KL kernel. NB:
# `dep:kiln-kt-bridge` is NOT enabled here — the bridge is only used
# inside the `cuda`-gated backward, so the Metal surface needs none of it.
metal = ["kiln-tensor/metal"]
