[package]
name = "kiln-graph-metal"
description = "Metal CapturedGraph scaffold and ICB replay object for Phase 5."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

# Per Phase 5 of #1082, kiln-graph-metal exposes the shared
# `kiln_graph::CapturedGraph` shape plus a reusable ICB replay object.
# The production Metal replay orchestration still lives in
# `crates/kiln-model/src/metal_graph.rs` until Phase 5.x moves or wraps it.
#
# Internal-only — no semver commitment.

[dependencies]
kiln-graph = { workspace = true }
kiln-tensor = { workspace = true }

[features]
# Enables the Metal ICB replay object. Without this feature the crate exposes
# only the scaffold types.
metal = ["kiln-tensor/metal"]
