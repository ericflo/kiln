[package]
name = "kiln-core"
description = "Core types and traits for Kiln inference server"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokenizers = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
# Optional: pulls Vulkan buffer types into the DeviceBuffer enum so
# training and inference can refer to the same residency primitive.
# Off by default so non-Vulkan builds keep kiln-core lean.
kiln-vulkan-kernel = { path = "../kiln-vulkan-kernel", optional = true }

[features]
default = []
vulkan = ["dep:kiln-vulkan-kernel"]
