[package]
name = "kiln-tensor"
description = "In-house Tensor + Storage substrate for kiln. Phase 0/1 scaffold; backends fill in over Phases 1-7."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
# build.rs compiles the CUDA-side `contiguous` kernel (csrc/contiguous.cu)
# when --features cuda is enabled. No-op outside the cuda feature.
build = "build.rs"

[build-dependencies]
cc = "1"

# kiln-tensor is internal-only — no semver commitment.
# Other kiln-* crates may break against minor version bumps until candle
# is removed and the surface stabilizes (Phase 7 of #1082).
# See `src/lib.rs` for the public-API stability statement.

[dependencies]
# `TensorId` lives in `kiln-tensor-id` (a dependency-free leaf crate) so
# that `kiln-vulkan-kernel` can also depend on it without creating the
# `kiln-tensor -> kiln-vulkan-kernel -> kiln-tensor` cargo path-dep cycle.
# kiln-tensor re-exports `TensorId` for backwards compatibility — all
# existing `kiln_tensor::TensorId` callers continue to work unchanged.
kiln-tensor-id = { workspace = true }

# Error machinery — Result wraps a thiserror enum, but a public callable
# bail! macro mirrors candle's ergonomic shape so 491+ migration sites
# can mechanically swap `candle_core::bail!(...)` -> `kiln_tensor::bail!(...)`.
thiserror = { workspace = true }
# anyhow is intentionally absent — kiln_tensor::Error owns its variants.

# bf16 / f16 element types — match the version the other kiln crates use.
half = "2"

# Safe byte-cast for typed CPU constructors (from_slice / to_vec).
bytemuck = { version = "1", features = ["extern_crate_alloc"] }

# Phase 1.9 — safetensors loader. Pinned to the workspace version so
# the loader reads the same file format every other crate writes.
safetensors = { workspace = true }
memmap2 = { workspace = true }

# Optional — pulled in under the `cuda` / `metal` features only. This is
# the workspace's candle dep so the cudarc version stays coherent with
# the rest of the crates. Phase 7 of #1082 (candle removal) replaces
# this with a direct cudarc dependency.
candle-core = { workspace = true, optional = true }

# Optional — pulled in under the `metal` feature only. Used by the
# `metal_types::sdpa` chokepoint re-export so `kiln-model::backend::metal`
# can call `kiln_tensor::metal_types::sdpa(...)` instead of naming
# `candle_nn::ops::sdpa` directly at 9 callsites. Phase 7 follow-up
# replaces this with a kt-native fused SDPA op.
candle-nn = { workspace = true, optional = true }

# Direct cudarc — replaces candle re-exports of driver types
# (`DevicePtr`) in `fp8.rs`. Same workspace pin as candle vendors so
# the compiled crate unifies. Issue #1082 seam-removal step.
cudarc = { workspace = true, optional = true }

# Optional — only under `metal`. Direct objc2-metal protocol-object
# types for the kiln-owned Metal substrate. `crate::metal_rt` is a
# vendored objc2 wrapper over the Apple Metal protocol objects (Device,
# Buffer, CommandQueue, the Commands command-buffer pool,
# ComputeCommandEncoder, ComputePipeline, Library) — it replaces the
# `candle_metal_kernels` dependency that #1082 removed once every compute
# kernel (matmul / cast / unary / binary / softmax / rmsnorm / layernorm /
# index_select / sdpa) was reimplemented as kiln-owned MSL in
# `metal_matmul.rs` + `metal_kernels.rs`. The version pin matches what
# candle-metal-kernels 0.10.2 used (`objc2 0.6`, `objc2-metal 0.3.2`,
# `objc2-foundation 0.3.2`) so the vendored wrapper is bit-identical to
# the known-good source.
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }


# Optional — pulled in under the `cuda` feature only. Provides the
# Phase 2.x `CublasLtMatmulHandle` that `MatmulOp::cuda_fwd` and
# `crate::cuda_matmul` dispatch through. Phase 7 retires the candle
# dep, but kiln-blas stays.
kiln-blas = { workspace = true, optional = true, features = ["cublaslt"] }

# Optional — pulled in under the `vulkan` feature only. kiln-vulkan-kernel
# is already candle-free (uses ash + custom GLSL compute) so this is a
# clean, permanent dependency — Phase 7 does NOT replace it.
kiln-vulkan-kernel = { path = "../kiln-vulkan-kernel", optional = true }

[features]
default = []
# CUDA storage. #1082 CP-1 CLOSED: the `cuda` feature is candle-free.
# The driver types come from `cudarc::driver::*` directly (`dep:cudarc`),
# and the cublasLt matmul layer from candle-free `kiln-blas`. The former
# `candle_core::cuda_backend::cudarc::driver::*` re-export hook was the
# last candle dependency in kiln-tensor's CUDA path; with `CudaStorage`/
# `CudaAllocator` holding `Arc<CudaContext>` (not `Arc<CudaDevice>`) and
# the test helper moved to `primary_cuda_context`, nothing under
# `--features cuda` touches candle. (candle-core stays an optional dep
# below for the `metal` feature only, until CP-2 closes that path.)
cuda = ["dep:cudarc", "dep:kiln-blas"]
# Reserved for Phase 1.7. Same pattern as `cuda`.
#
# `objc2` + `objc2-metal` + `objc2-foundation` back the kiln-owned Metal
# substrate in `crate::metal_rt` (#1082): the vendored objc2 wrapper that
# replaced the `candle_metal_kernels` dependency. candle-core / candle-nn
# remain optional deps under this feature for the (test-only) candle-Tensor
# interop in `kiln-model::backend::metal`'s test module; no `kiln-tensor`
# code path names them anymore.
metal = ["dep:candle-core", "candle-core?/metal", "dep:candle-nn", "candle-nn?/metal", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
# Phase 1.8 — Vulkan storage. Does NOT go through candle: lifts
# kiln-vulkan-kernel's already-candle-free VulkanBuffer + VulkanDevice.
# This is a permanent dependency (Phase 7 does not change it).
vulkan = ["dep:kiln-vulkan-kernel"]

[dev-dependencies]
# Phase 1.131's `training_full_block` integration test threads
# kiln-autograd backwards through the substrate end-to-end. Mirrors
# the dev-dep wiring already used by kiln-optim's training tests.
kiln-autograd = { workspace = true }
