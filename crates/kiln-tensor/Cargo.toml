[package]
name = "kiln-tensor"
description = "In-house Tensor + Storage substrate for kiln. Phase 0/1 scaffold; backends fill in over Phases 1-7."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
# build.rs compiles the CUDA-side `contiguous` kernel (csrc/contiguous.cu)
# when --features cuda is enabled. No-op outside the cuda feature.
build = "build.rs"

[build-dependencies]
cc = "1"

# kiln-tensor is internal-only — no semver commitment.
# Other kiln-* crates may break against minor version bumps until candle
# is removed and the surface stabilizes (Phase 7 of #1082).
# See `src/lib.rs` for the public-API stability statement.

[dependencies]
# Error machinery — Result wraps a thiserror enum, but a public callable
# bail! macro mirrors candle's ergonomic shape so 491+ migration sites
# can mechanically swap `candle_core::bail!(...)` -> `kiln_tensor::bail!(...)`.
thiserror = { workspace = true }
# anyhow is intentionally absent — kiln_tensor::Error owns its variants.

# bf16 / f16 element types — match the version the other kiln crates use.
half = "2"

# Safe byte-cast for typed CPU constructors (from_slice / to_vec).
bytemuck = { version = "1", features = ["extern_crate_alloc"] }

# Phase 1.9 — safetensors loader. Pinned to the workspace version so
# the loader reads the same file format every other crate writes.
safetensors = { workspace = true }
memmap2 = { workspace = true }

# Optional — pulled in under the `cuda` / `metal` features only. This is
# the workspace's candle dep so the cudarc version stays coherent with
# the rest of the crates. Phase 7 of #1082 (candle removal) replaces
# this with a direct cudarc dependency.
candle-core = { workspace = true, optional = true }

# Optional — only under `metal`. `metal_storage.rs` references
# `candle_metal_kernels::metal::Buffer` / `MTLStorageMode` directly;
# candle-core does NOT re-export the `candle_metal_kernels` crate, so
# we have to depend on it explicitly (matches kiln-model's pin).
candle-metal-kernels = { version = "0.10", optional = true }


# Optional — pulled in under the `cuda` feature only. Provides the
# Phase 2.x `CublasLtMatmulHandle` that `MatmulOp::cuda_fwd` and
# `crate::cuda_matmul` dispatch through. Phase 7 retires the candle
# dep, but kiln-blas stays.
kiln-blas = { workspace = true, optional = true, features = ["cublaslt"] }

# Optional — pulled in under the `vulkan` feature only. kiln-vulkan-kernel
# is already candle-free (uses ash + custom GLSL compute) so this is a
# clean, permanent dependency — Phase 7 does NOT replace it.
kiln-vulkan-kernel = { path = "../kiln-vulkan-kernel", optional = true }

[features]
default = []
# Phase 1.6 — CUDA storage. The `cuda` feature pulls candle-core (cuda)
# as the cudarc vendor; we reach the driver types as
# `candle_core::cuda_backend::cudarc::driver::*` matching the pattern in
# kiln-conv1d-kernel / kiln-flash-attn / kiln-model::cuda_graph. This is
# the SINGLE candle hook in kiln-tensor; Phase 7 replaces it.
cuda = ["dep:candle-core", "candle-core?/cuda", "dep:kiln-blas"]
# Reserved for Phase 1.7. Same pattern as `cuda`.
metal = ["dep:candle-core", "candle-core?/metal", "dep:candle-metal-kernels"]
# Phase 1.8 — Vulkan storage. Does NOT go through candle: lifts
# kiln-vulkan-kernel's already-candle-free VulkanBuffer + VulkanDevice.
# This is a permanent dependency (Phase 7 does not change it).
vulkan = ["dep:kiln-vulkan-kernel"]

[dev-dependencies]
# Phase 1.131's `training_full_block` integration test threads
# kiln-autograd backwards through the substrate end-to-end. Mirrors
# the dev-dep wiring already used by kiln-optim's training tests.
kiln-autograd = { workspace = true }
