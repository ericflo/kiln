[package]
name = "kiln-flce-kernel"
description = "Fused Linear Cross-Entropy (FLCE) — chunked cross-entropy over vocab without materializing the full [T, V] logits tensor. kt-typed building blocks (kt_api forward+backward, kt_tape Tape recorder); candle-free as of #1082 (the candle Phase A/B reference + CustomOp1 shims moved to kiln-train::flce_candle_shim)."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# (#1082) candle-drop: this crate is now 100% candle-free (the THIRD
# kernel-crate candle drop, after kiln-opd-loss-kernel and
# kiln-rmsnorm-kernel). The candle-typed glue the SFT/FLCE trainer needs
# (the pure-candle Phase A reference, the Phase B candle `CustomOp1`, the
# `KtForwardOp1` kt-forward-op shim, and the kt-tape production-caller
# adapter) moved UP into `kiln-train::flce_candle_shim`, which keeps candle
# (and already depends on `kiln-kt-bridge`). `candle-core`, `anyhow`,
# `tracing`, and `kiln-kt-bridge` were the deps those moved paths needed;
# with them gone the kept code (`kt_api`, `kt_tape`) is pure `kiln_tensor`
# + `kiln_autograd`.
#
# kt-typed forward + manual backward over `kiln_tensor::Tensor` ops (see
# `kt_api`). No CUDA FFI of its own — the chunked log-sum-exp reduction is
# expressed entirely in kt-tensor ops, which carry their own backend
# dispatch.
kiln-tensor = { workspace = true }
# Phase 6a/CP-4 (#1082): kt-tape FLCE shim records onto kiln_autograd::Tape.
kiln-autograd = { workspace = true }

[features]
# Activates the CUDA-backed `kiln-tensor` ops behind the kt entries (and
# the runtime-gated CUDA E2E tests in `kt_tape`). There is no FFI / build.rs
# in this crate, so the feature only forwards to `kiln-tensor/cuda`.
# kiln-train re-exports this feature via its own `cuda` feature so
# `cargo build --features cuda` activates it.
cuda = ["kiln-tensor/cuda"]

# Phase R.7 (ROCm port): mirrors `cuda`, swapping `kiln-tensor/cuda` ->
# `kiln-tensor/rocm`. This crate is a PURE-KT COMPOSITE: the FLCE forward +
# backward are expressed entirely in `kiln_tensor::Tensor` ops (matmul, exp,
# index_select, scatter_add, ...), which carry their own backend dispatch, so
# there is no FFI / build.rs / .cu of its own — the feature only forwards to
# `kiln-tensor/rocm`, exactly like `cuda` forwards to `kiln-tensor/cuda`.
# kiln-train re-exports this feature via its own `rocm` feature so
# `cargo build --features rocm` activates it.
rocm = ["kiln-tensor/rocm"]

# Note: there is no `[dev-dependencies]` section. The previously-listed
# `candle-nn = { workspace = true }` dev-dep was unused — no src/, tests/,
# or benches/ file referenced `candle_nn` — and was dropped as part of
# the #1082 candle-core dep evaluation
# (`docs/archive/candle-removal/kiln-flce-kernel-candle-drop-stop-2026-05-28.md`).
