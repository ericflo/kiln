[package]
name = "kiln-flce-kernel"
description = "Fused Linear Cross-Entropy (FLCE) — chunked cross-entropy over vocab without materializing the full [T, V] logits tensor. Phase A: pure-candle implementation; Phase B: manual-backward CustomOp1; Phase 7 prep: kt-typed parallel surface (see `kt_api`)."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
candle-core = { workspace = true }
# kt-typed parallel surface (see `kt_api`). Phase 7 prep — no CUDA
# feature is needed here because the kt-typed trait lives at the
# Rust level only; it does not invoke any CUDA FFI yet (kiln-flce
# has no FFI of its own, unlike the other Phase 7 kernel crates).
kiln-tensor = { workspace = true }
anyhow = { workspace = true }

[features]
# Enable the CUDA path in `FlceCustomOp::cuda_fwd`. Without this feature the
# CUDA forward errors out at runtime ("CUDA not enabled"); the CPU path works
# either way. kiln-train re-exports this feature via its own `cuda` feature
# so `cargo build --features cuda --bin kiln-bench` activates it.
cuda = ["candle-core/cuda", "kiln-tensor/cuda"]

[dev-dependencies]
candle-nn = { workspace = true }
