[package]
name = "kiln-vulkan-kernel"
description = "Vulkan compute kernels for Kiln (GLSL compute shaders)"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vulkan_decode_microbench"
path = "src/bin/vulkan_decode_microbench.rs"
test = true
bench = false

[dependencies]
kiln-tensor-id = { workspace = true }
anyhow = { workspace = true }
half = "2"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
tracing = { workspace = true }
ash = "0.38"
libc = "0.2"
libloading = "0.9"

[dev-dependencies]
# kiln-tensor is the in-house CPU oracle for the parity tests after
# #1082. `tests/gdn_parity.rs` builds its GDN reference on kiln_tensor
# instead of candle-core; remaining test files are migrating off candle.
kiln-tensor = { workspace = true }
# candle-core is dev-only after #1082: the production crate is
# candle-free, but a handful of in-tree `#[cfg(test)]` blocks and
# `tests/*.rs` parity tests still build CPU candle tensors as the
# numerical reference.
# (#1082) candle-core dev-dep DROPPED: test oracles de-candled to kiln_tensor / finite-diff (a00ea3d4 follow-up).
# Phase 0.9 probe writes a JSON report. Dev-only so production builds
# don't pick it up.
serde_json = { workspace = true }
serde = { workspace = true }
