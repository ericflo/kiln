[package]
name = "kiln-kt-bridge"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared helpers for Phase 7 kt-API ports (CudaStorage downcast, alloc, device-pointer extraction) used by the kernel crates."

[dependencies]
# Same CUDA pinning as the kernel crates. kiln-kt-bridge always uses
# kiln-tensor's cuda feature — there is no non-CUDA build.
candle-core = { workspace = true, features = ["cuda"] }
kiln-tensor = { workspace = true, features = ["cuda"] }
# Half-precision floats — needed for the per-dtype `as_cuda_slice<T>()`
# dispatch in the candle-to-kt copying adapter.
half = "2"

[dev-dependencies]
# Used by tests/cuda_backward_parity.rs — verifies that kiln-autograd
# BackwardOps produce correct gradients when forward inputs live on
# CUDA. (#1082)
kiln-autograd = { workspace = true }
