[package]
name = "kiln-kt-bridge"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared helpers for Phase 7 kt-API ports (CudaStorage downcast, alloc, device-pointer extraction, plus kt-native tape scopes)."

[features]
# (#1082) candle fully removed from kiln-kt-bridge — kt-native bridge only.
default = []

# Enables the CUDA-touching kt-native helpers (CudaStorage downcast,
# alloc, device-pointer extraction) and the kt-native `tape_bridge`
# scopes. Pulls `kiln-tensor/cuda` so the cudarc-typed code paths
# compile. (#1082)
cuda = ["kiln-tensor/cuda"]

# Forwards `kiln-tensor/metal` only — the metal lane is candle-free (#1082).
# Enables the device-agnostic `tape_bridge` scopes on the metal build.
metal = ["kiln-tensor/metal"]

[dependencies]
kiln-tensor = { workspace = true }
# CP-4 (#1082): the `tape_bridge` module owns the kt-native tape scopes
# (IO-mapping + tape-authoritative backward) used by the `_kt` training
# adapters. It depends on `kiln-autograd` for the `Tape` substrate.
kiln-autograd = { workspace = true }
