[package]
name = "kiln-kt-bridge"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared helpers for Phase 7 kt-API ports (CudaStorage downcast, alloc, device-pointer extraction, plus pure candle<->kt Device/DType mapping)."

[features]
default = []
# Enables the CUDA-touching helpers (CudaStorage downcast, alloc,
# device-pointer extraction, candle CUDA Tensor borrow/copy adapters,
# and the `forward_op` CustomOp shim). Pulls candle-core (cuda) and
# kiln-tensor (cuda) so the cudarc-typed code paths compile.
#
# Without this feature, kiln-kt-bridge still exposes the four pure
# `candle <-> kt` Device/DType enum-mapping helpers
# (`candle_dtype_to_kt`, `kt_dtype_to_candle`, `kt_device_from_candle`,
# `candle_device_from_kt`) so multi-backend builds (Metal, Vulkan, CPU)
# of `kiln-model` / `kiln-server` can use them without dragging in a
# CUDA toolchain. The mapping helpers only touch candle's `Device` /
# `DType` enums, which are part of the candle-core base API and have
# no CUDA dep themselves. (#1082)
cuda = ["candle-core/cuda", "kiln-tensor/cuda"]

# Enables Metal-aware Device enum mapping in `kt_device_from_candle`
# and `candle_device_from_kt`. Without this feature, the helpers still
# compile but `candle_core::Device::Metal(_)` inputs are skipped (the
# arm is `#[cfg(feature = "metal")]`-gated) and the inverse Metal arm
# errors out with `BridgeError`. The feature forwards
# `candle-core/metal` so that `MetalDevice::location()` returns a real
# `DeviceLocation::Metal { gpu_id }` instead of the
# `dummy_metal_backend` `fail!()` stub. `kiln-tensor/metal` is
# forwarded for parity with the `cuda` pattern; the `KtDevice::Metal(_)`
# variant itself is unconditional on the kt side. (#1082)
metal = ["candle-core/metal", "kiln-tensor/metal"]

[dependencies]
# Candle is always present; the `cuda` feature forwards `candle-core/cuda`
# (and `kiln-tensor/cuda`) to pull in the cudarc-typed code paths. The
# pure `candle <-> kt` Device/DType enum-mapping helpers only need the
# candle base API and compile on every host without a CUDA toolchain.
candle-core = { workspace = true }
kiln-tensor = { workspace = true }
# Phase 6a/CP-4 (#1082): the `tape_bridge` module owns the
# candle⟷kt TensorId mapping that lets `kiln_autograd::Tape::backward`
# emit gradients into a `candle_core::backprop::GradStore`. Pure
# `kiln-autograd` cannot pull in candle, so the bridge lives here
# (the only crate that already depends on both halves).
kiln-autograd = { workspace = true }
# Half-precision floats — needed for the per-dtype `as_cuda_slice<T>()`
# dispatch in the candle-to-kt copying adapter (cuda feature only).
half = "2"
