[package]
name = "kiln-graph-cuda"
description = "CUDA CapturedGraph scaffold for the Phase 5 replay vocabulary."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

# Per Phase 5 of #1082, kiln-graph-cuda implements the shared
# `kiln_graph::CapturedGraph` trait as a scaffold: backend tag, replay
# counter, and scratch bytes that compile on any host. It does not yet wrap
# `cudarc::driver::CudaGraph` + `CudaGraphExec`; the production CUDA decode
# graph runner still lives in `crates/kiln-model/src/cuda_graph.rs`.
#
# Internal-only — no semver commitment.

[dependencies]
kiln-graph = { workspace = true }
kiln-tensor = { workspace = true }

[features]
# Reserved for the real cudarc-backed capture pipeline. Without this feature
# the crate exposes only the scaffold types so it can be built / unit-tested
# on hosts without the CUDA toolchain.
cuda = []
