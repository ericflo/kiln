[package]
name = "kiln-mps"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kiln-tensor's Metal BLAS layer (MPSMatrixMultiplication + custom MSL). Phase 2.2 backend-agnostic types + Apple-Silicon UMA helpers."
build = "build.rs"

# Sibling to kiln-blas (CUDA) and kiln-vulkan-blas (Vulkan).
#
# Phase 2.2 ships only the backend-agnostic types (extensions to
# kiln-blas's AlgoCache + WorkspacePool with Metal-specific keys);
# Phase 2.x adds the feature-gated MPSMatrixMultiplication wrapper
# + the actual mps_mlp_probe example.

[features]
default = []
# Builds the Metal probe binary. build.rs links the Metal + MetalKit
# frameworks when this feature is on. Same shape as kiln-blas's
# `probe` feature.
#
# #1082: this feature no longer depends on `candle-core`. The previous
# rationale was "candle-core's metal feature is the metal-rs vendor";
# no source file in this crate uses any candle type (zero `use
# candle_core::*` imports), so candle-core was dead weight. When the
# actual `mps_mlp_probe` binary lands it will pull `metal-rs` (or
# `objc2-metal`) directly, matching the kiln-blas pattern of "add the
# substrate driver crate directly when the probe is implemented".
probe = []

[dependencies]
# Backend-agnostic types come from kiln-blas; we re-export the
# matching shapes here so Metal users have one consistent import path.
kiln-blas = { workspace = true }

[build-dependencies]
cc = "1"
