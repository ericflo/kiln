[package]
name = "kiln-optim"
description = "Fused per-backend optimizer step for kiln. AdamW / SGD / Lion / Muon over kiln-param::Parameter."
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

# Phase 6.5 of #1082. The CPU AdamW reference path lands in this PR;
# per-backend GPU impls (kiln-blas / kiln-mps / kiln-vulkan-blas) plug
# in via the same OptimStep trait in subsequent PRs.
#
# Internal-only — no semver commitment until Phase 7 ships.

[dependencies]
kiln-tensor = { workspace = true }
kiln-param = { workspace = true }
thiserror = { workspace = true }
# bf16/f16 byte decoders for the master-weight unpack path in
# adamw.rs / sgd.rs / lion.rs / muon.rs. Matches the workspace-wide
# `half = "2"` pin (see kiln-tensor, kiln-blas, kiln-mps, etc.).
half = "2"

[dev-dependencies]
# Phase 1.42's full-training-step integration test pulls kiln-autograd
# alongside kiln-optim. Production callers in kiln-train will do the
# same.
kiln-autograd = { workspace = true }
# Byte-cast for the tied-weight integration test that reads a CPU
# gradient back as Vec<f32>. Matches the kiln-tensor pin.
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
