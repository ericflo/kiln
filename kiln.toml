[model]
path = "./Qwen3.5-4B"

[training]
# Aggressive gradient checkpointing: more segments = less VRAM during training.
# Default is auto (typically 4); increasing to 16 trades compute for memory.
grad_checkpoint_segments = 32

[speculative]
enabled = true
num_speculative_tokens = 4

[prefix_cache]
enabled = true

[logging]
level = "info"
format = "json"
