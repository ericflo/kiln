[workspace]
resolver = "2"
members = [
    "crates/kiln-blas",
    "crates/kiln-core",
    "crates/kiln-conv1d-kernel",
    "crates/kiln-eval",
    "crates/kiln-flash-attn",
    "crates/kiln-flce-kernel",
    "crates/kiln-gdn-kernel",
    "crates/kiln-kt-bridge",
    "crates/kiln-marlin-gemm",
    "crates/kiln-memory",
    "crates/kiln-model",
    "crates/kiln-nvtx",
    "crates/kiln-autograd",
    "crates/kiln-graph",
    "crates/kiln-graph-cuda",
    "crates/kiln-graph-metal",
    "crates/kiln-graph-vulkan",
    "crates/kiln-hip",
    "crates/kiln-mps",
    "crates/kiln-opd-loss-kernel",
    "crates/kiln-optim",
    "crates/kiln-param",
    "crates/kiln-resource",
    "crates/kiln-rmsnorm-kernel",
    "crates/kiln-rocblas",
    "crates/kiln-scheduler",
    "crates/kiln-server",
    "crates/kiln-tensor",
    "crates/kiln-tensor-id",
    "crates/kiln-train",
    "crates/kiln-vulkan-blas",
    "crates/kiln-vulkan-kernel",
]
# kiln-conv1d-kernel, kiln-flash-attn, kiln-gdn-kernel, kiln-marlin-gemm,
# kiln-rmsnorm-kernel, kiln-vulkan-kernel, and kiln-hip unconditionally depend
# on platform-specific GPU runtimes (cudarc, vulkan-rs, amdhip64) which fail to
# link on hosts without the matching GPU stack. They're only compiled when a
# downstream crate opts in via --features cuda / --features vulkan /
# --features rocm. (kiln-hip's FFI itself compiles fine on any host — `cargo
# check` never links — but its tests link amdhip64, so it stays out of
# default-members like the other GPU-only crates.)
# Excluding them from default-members lets `cargo check`, `cargo build`,
# and `cargo test` work on any host; Linux+CUDA/Vulkan builds still pull
# them via feature activation on the real binary target.
#
# kiln-blas is in default-members because Phase 2.1's backend-agnostic
# types (AlgoCache + WorkspacePool) compile without the CUDA toolchain.
# The cublasLt probe is gated behind `--features probe`.
default-members = [
    "crates/kiln-autograd",
    "crates/kiln-blas",
    "crates/kiln-core",
    "crates/kiln-eval",
    "crates/kiln-flce-kernel",
    "crates/kiln-graph",
    "crates/kiln-graph-cuda",
    "crates/kiln-graph-metal",
    "crates/kiln-graph-vulkan",
    # kiln-kt-bridge's default build (candle on via the default-on
    # `candle` feature, no `--features cuda`) is the pure
    # `candle <-> kt` Device/DType enum-mapping helpers — no CUDA
    # toolchain needed. The CudaStorage downcast / device-ptr /
    # forward_op shim are behind the `cuda` feature; candle itself is
    # now an optional (default-on) feature so candle-free consumers can
    # opt out with `default-features = false`. (#1082)
    "crates/kiln-kt-bridge",
    "crates/kiln-memory",
    "crates/kiln-model",
    "crates/kiln-mps",
    "crates/kiln-nvtx",
    "crates/kiln-opd-loss-kernel",
    "crates/kiln-optim",
    "crates/kiln-param",
    "crates/kiln-resource",
    "crates/kiln-scheduler",
    "crates/kiln-server",
    "crates/kiln-tensor",
    "crates/kiln-tensor-id",
    "crates/kiln-train",
    "crates/kiln-vulkan-blas",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ericflo/kiln"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
socket2 = "0.6.4"
portable-pty = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Tokenization
tokenizers = { version = "0.23", features = ["http"] }
# `json` enables the `tojson` filter, which Qwen3.5-4B's chat_template uses
# to emit each tool definition (`{{ tool | tojson }}`). Without it, every
# tools-bearing /v1/chat/completions request 4xx's with
# `unknown filter: tojson`. See PR comment for the load-bearing call site.
minijinja = { version = "2", features = ["json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Model loading
safetensors = "0.7"
memmap2 = "0.9"

# Adapter packaging (tar.gz export)
tar = "0.4"
flate2 = "1"

# cudarc — direct CUDA driver bindings for the kiln-tensor CUDA substrate.
# (#1082) candle-core/candle-nn are fully removed from kiln; cudarc is pinned
# to the version the substrate's cublas/driver bindings require.
cudarc = { version = "0.19.4", default-features = false, features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-linking",
] }
kiln-conv1d-kernel = { path = "crates/kiln-conv1d-kernel" }
kiln-flash-attn = { path = "crates/kiln-flash-attn" }
kiln-flce-kernel = { path = "crates/kiln-flce-kernel" }
kiln-gdn-kernel = { path = "crates/kiln-gdn-kernel" }
# kiln-hip — bounded ROCm/HIP runtime bindings (the cudarc analog) for the
# ROCm backend. Pulled in by kiln-tensor's `rocm` feature in Phase R.3.
kiln-hip = { path = "crates/kiln-hip" }
kiln-rocblas = { path = "crates/kiln-rocblas" }
kiln-kt-bridge = { path = "crates/kiln-kt-bridge" }
kiln-marlin-gemm = { path = "crates/kiln-marlin-gemm" }
kiln-memory = { path = "crates/kiln-memory" }
kiln-nvtx = { path = "crates/kiln-nvtx" }
kiln-opd-loss-kernel = { path = "crates/kiln-opd-loss-kernel" }
kiln-rmsnorm-kernel = { path = "crates/kiln-rmsnorm-kernel" }
kiln-vulkan-kernel = { path = "crates/kiln-vulkan-kernel" }
# Random number generation
rand = "0.10"

# Hashing (replay_hash chain for LoRA lineage)
sha2 = "0.11"

# Data-parallel iteration
rayon = "1"

# Testing
tempfile = "3"

# Internal crates
kiln-autograd = { path = "crates/kiln-autograd" }
kiln-blas = { path = "crates/kiln-blas" }
kiln-core = { path = "crates/kiln-core" }
kiln-eval = { path = "crates/kiln-eval" }
kiln-graph = { path = "crates/kiln-graph" }
kiln-graph-cuda = { path = "crates/kiln-graph-cuda" }
kiln-graph-metal = { path = "crates/kiln-graph-metal" }
kiln-graph-vulkan = { path = "crates/kiln-graph-vulkan" }
kiln-model = { path = "crates/kiln-model" }
kiln-optim = { path = "crates/kiln-optim" }
kiln-param = { path = "crates/kiln-param" }
kiln-resource = { path = "crates/kiln-resource" }
kiln-scheduler = { path = "crates/kiln-scheduler" }
kiln-server = { path = "crates/kiln-server" }
kiln-tensor = { path = "crates/kiln-tensor" }
kiln-tensor-id = { path = "crates/kiln-tensor-id" }
kiln-train = { path = "crates/kiln-train" }
