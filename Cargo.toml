[workspace]
resolver = "2"
members = [
    "crates/kiln-blas",
    "crates/kiln-core",
    "crates/kiln-conv1d-kernel",
    "crates/kiln-eval",
    "crates/kiln-flash-attn",
    "crates/kiln-flce-kernel",
    "crates/kiln-gdn-kernel",
    "crates/kiln-marlin-gemm",
    "crates/kiln-model",
    "crates/kiln-nvtx",
    "crates/kiln-autograd",
    "crates/kiln-graph",
    "crates/kiln-opd-loss-kernel",
    "crates/kiln-optim",
    "crates/kiln-param",
    "crates/kiln-rmsnorm-kernel",
    "crates/kiln-scheduler",
    "crates/kiln-server",
    "crates/kiln-tensor",
    "crates/kiln-train",
    "crates/kiln-vulkan-kernel",
]
# kiln-blas, kiln-conv1d-kernel, kiln-flash-attn, kiln-gdn-kernel,
# kiln-marlin-gemm, kiln-rmsnorm-kernel, and kiln-vulkan-kernel
# unconditionally depend on platform-specific GPU runtimes
# (cudarc, cublasLt, vulkan-rs) which fail to link on hosts without the
# matching GPU stack. They're only compiled when a downstream
# crate opts in via --features cuda or --features vulkan.
# Excluding them from default-members lets `cargo check`, `cargo build`, and
# `cargo test` work on any host; Linux+CUDA/Vulkan builds still pull them via
# feature activation on the real binary target.
default-members = [
    "crates/kiln-autograd",
    "crates/kiln-core",
    "crates/kiln-eval",
    "crates/kiln-flce-kernel",
    "crates/kiln-graph",
    "crates/kiln-model",
    "crates/kiln-nvtx",
    "crates/kiln-opd-loss-kernel",
    "crates/kiln-optim",
    "crates/kiln-param",
    "crates/kiln-scheduler",
    "crates/kiln-server",
    "crates/kiln-tensor",
    "crates/kiln-train",
]

[workspace.package]
version = "0.2.19"
edition = "2024"
license = "MIT"
repository = "https://github.com/ericflo/kiln"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Tokenization
tokenizers = { version = "0.23", features = ["http"] }
# `json` enables the `tojson` filter, which Qwen3.5-4B's chat_template uses
# to emit each tool definition (`{{ tool | tojson }}`). Without it, every
# tools-bearing /v1/chat/completions request 4xx's with
# `unknown filter: tojson`. See PR comment for the load-bearing call site.
minijinja = { version = "2", features = ["json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Model loading
safetensors = "0.7"
memmap2 = "0.9"

# Adapter packaging (tar.gz export)
tar = "0.4"
flate2 = "1"

# Tensor compute
candle-core = "0.10"
candle-nn = "0.10"
kiln-conv1d-kernel = { path = "crates/kiln-conv1d-kernel" }
kiln-flash-attn = { path = "crates/kiln-flash-attn" }
kiln-flce-kernel = { path = "crates/kiln-flce-kernel" }
kiln-gdn-kernel = { path = "crates/kiln-gdn-kernel" }
kiln-marlin-gemm = { path = "crates/kiln-marlin-gemm" }
kiln-nvtx = { path = "crates/kiln-nvtx" }
kiln-opd-loss-kernel = { path = "crates/kiln-opd-loss-kernel" }
kiln-rmsnorm-kernel = { path = "crates/kiln-rmsnorm-kernel" }
kiln-vulkan-kernel = { path = "crates/kiln-vulkan-kernel" }
# Random number generation
rand = "0.10"

# Hashing (replay_hash chain for LoRA lineage)
sha2 = "0.11"

# Data-parallel iteration
rayon = "1"

# Testing
tempfile = "3"

# Internal crates
kiln-autograd = { path = "crates/kiln-autograd" }
kiln-core = { path = "crates/kiln-core" }
kiln-eval = { path = "crates/kiln-eval" }
kiln-graph = { path = "crates/kiln-graph" }
kiln-model = { path = "crates/kiln-model" }
kiln-optim = { path = "crates/kiln-optim" }
kiln-param = { path = "crates/kiln-param" }
kiln-scheduler = { path = "crates/kiln-scheduler" }
kiln-server = { path = "crates/kiln-server" }
kiln-tensor = { path = "crates/kiln-tensor" }
kiln-train = { path = "crates/kiln-train" }

[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
