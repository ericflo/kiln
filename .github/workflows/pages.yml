name: Pages

on:
  pull_request:
  schedule:
    # Rebuild the complete public surface monthly so stale generated content,
    # broken links, and route-inventory drift fail visibly even without a push.
    - cron: '23 14 1 * *'
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'kiln.example.toml'
      - 'crates/kiln-model/src/backend/**'
      - 'crates/kiln-model/src/generate.rs'
      - 'crates/kiln-server/src/api/**'
      - 'crates/kiln-server/src/bench.rs'
      - 'crates/kiln-server/src/cli.rs'
      - 'crates/kiln-server/src/config.rs'
      - 'crates/kiln-server/src/ui/**'
      - 'crates/kiln-vulkan-kernel/**'
      - 'desktop/ui/**'
      - 'qualification/receipts/**'
      - 'contracts/thinking-budget-v1.schema.json'
      - 'contracts/thinking-budget-v1.conformance.json'
      - 'contracts/kiln-config-v1.schema.json'
      - 'contracts/kiln-http-api-v1.openapi.json'
      - 'contracts/kiln-inference-v1.schema.json'
      - 'contracts/kiln-observability-v1.schema.json'
      - 'contracts/kiln-artifacts-v1.schema.json'
      - 'contracts/kiln-evals-v1.schema.json'
      - 'contracts/kiln-control-plane-v1.schema.json'
      - 'contracts/kiln-openenv-v1.schema.json'
      - 'contracts/runtime-defaults-v1.json'
      - 'crates/kiln-server/src/ui/index.html'
      - 'desktop/ui/dashboard.html'
      - 'desktop/ui/settings.html'
      - 'kiln.example.toml'
      - 'scripts/check_docs_site_smoke.mjs'
      - 'scripts/check_thinking_budget_contract.mjs'
      - 'scripts/check_release_versions.py'
      - 'scripts/check_config_schema.py'
      - 'scripts/check_http_api_contract.py'
      - 'scripts/generate_observability_schema.py'
      - 'scripts/generate_artifact_schema.py'
      - 'scripts/generate_eval_schema.py'
      - 'scripts/generate_control_plane_schema.py'
      - 'scripts/json_schema_subset.py'
      - 'scripts/docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/docs-site/package-lock.json
      - name: Install pinned documentation tooling
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROME_DOWNLOAD: "true"
        run: npm ci --prefix scripts/docs-site
      - name: Check thinking-budget schema and documentation
        run: node scripts/check_thinking_budget_contract.mjs
      - name: Check configuration schema and documentation
        run: python3 scripts/check_config_schema.py --self-test
      - name: Check HTTP API operation contract
        run: |
          python3 scripts/generate_observability_schema.py --check
          python3 scripts/generate_artifact_schema.py --check
          python3 scripts/generate_eval_schema.py --check
          python3 scripts/generate_control_plane_schema.py --check
          python3 scripts/check_http_api_contract.py --self-test
      - name: Check release version drift
        run: python3 scripts/check_release_versions.py
      - name: Locate Chromium
        run: |
          CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME_BIN" ]; then
            echo "Could not find Chromium/Chrome for docs site smoke check" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test and build documentation
        run: |
          npm test --prefix scripts/docs-site
          node scripts/docs-site/build.mjs --out _site
      - name: Check assembled documentation site
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROME_DOWNLOAD: "true"
          KILN_DOCS_SITE_ROOT: _site
          KILN_DOCS_REQUIRE_GENERATED: "true"
        run: node scripts/check_docs_site_smoke.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
