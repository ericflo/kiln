name: Perf regression nightly

# #1077 — Per-PR perf coverage is in `ci.yml`'s default test runs
# (Tier 1a/1b/1c — auto-tune matrix tests + sft_train CPU smoke +
# tracing wire test, all on GHA-hosted runners with no GPU).
#
# This workflow is Tier 2 + Tier 3:
#   Tier 2 — cron-fired against `main`, picks up the latest merge,
#            runs the canonical workload corpus on an A6000, and gates
#            against the baselines in `bench-results/regression/`.
#   Tier 3 — `workflow_dispatch`-triggered with an optional ref input,
#            for authors validating a perf-sensitive change before merge
#            or chasing a regression the nightly caught.
#
# Cost model: ~60s of A6000 compute per dispatch × $0.49/hr ≈ $0.01/day
# at the cron cadence below. The `gate-self-test` job runs on the free
# GitHub-hosted runner and exercises the regression-check script plus the
# backend latency fixture contract on synthetic/local inputs, so the gate
# logic is verified on every dispatch even if no self-hosted runner is
# online yet.

on:
  schedule:
    # 06:00 UTC nightly — ~22:00 / 23:00 PT depending on DST, after most
    # PRs are merged. Move this earlier or later by editing the cron.
    - cron: '0 6 * * *'
  # #1082 §9 "CPU-only smoke variant" — fires the GHA-hosted
  # `gate-self-test` job on every PR that touches the gate scripts,
  # baselines, latency fixture contract, or workflow YAML. The heavy
  # `cuda-bench` job is gated by schedule or a workflow_dispatch without a
  # selected backend latency fixture, so fixture-only dispatches can collect
  # threshold artifacts without also running the training perf matrix.
  pull_request:
    paths:
      - 'bench-results/check_sft_train_regression.py'
      - 'bench-results/regression/**'
      - 'docs/backend-latency-fixtures.json'
      - 'docs/backend-latency-result-schema.md'
      - 'scripts/run_backend_latency_fixture.py'
      - 'scripts/write_backend_latency_result_artifact.py'
      - 'scripts/import_backend_latency_artifact.py'
      - 'scripts/lock_backend_latency_thresholds.py'
      - 'scripts/check_backend_latency_fixtures.py'
      - 'scripts/plan_backend_latency_fixture_dispatch.py'
      - '.github/workflows/perf-regression-nightly.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit ref to bench (default: latest main)'
        required: false
        default: ''
      trainer:
        description: 'Which trainer flag to bench against (native|generic|both)'
        required: false
        default: 'both'
      write_baseline_if_null:
        description: 'Seed `null` baseline fields with the observed numbers from this run'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      latency_fixture_id:
        description: 'Optional backend latency fixture id to run and upload (use none to skip)'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'cuda_rtx4090_matmul_qwen35_4b'
          - 'metal_apple_silicon_matmul_qwen35_4b'
          - 'metal_apple_silicon_sdpa_qwen35_4b'
          - 'rocm_gfx1151_matmul_qwen35_4b'
          - 'vulkan_rtx6000_decode_microbench'
      latency_runner_labels_json:
        description: 'JSON runs-on labels for the selected latency fixture'
        required: false
        default: '["self-hosted"]'

env:
  CARGO_TERM_COLOR: always
  KILN_CUDA_ARCHS: "86"

jobs:
  # -------------------------------------------------------------------
  # Tier 1d (de facto): regression-check and latency fixture self-tests.
  #
  # Runs on every dispatch on the free GitHub-hosted runner so the
  # check_sft_train_regression.py logic and non-hardware latency fixture
  # contract are mechanically verified even when the self-hosted CUDA
  # runner is offline.
  # -------------------------------------------------------------------
  gate-self-test:
    name: regression-check script self-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify backend latency fixture contract
        run: |
          python3 scripts/run_backend_latency_fixture.py --self-test
          python3 scripts/write_backend_latency_result_artifact.py --self-test
          python3 scripts/import_backend_latency_artifact.py --self-test
          python3 scripts/lock_backend_latency_thresholds.py --self-test
          python3 scripts/check_backend_latency_fixtures.py --self-test
          python3 scripts/plan_backend_latency_fixture_dispatch.py --self-test
          python3 scripts/check_backend_latency_fixtures.py docs/backend-latency-fixtures.json --require-covered

      - name: Verify gate accepts a within-tolerance run (no regression)
        run: |
          cat > /tmp/fake_bench_ok.json <<'EOF'
          {
            "training": {
              "num_steps": 5,
              "total_time_secs": 4.25,
              "secs_per_step": 0.85,
              "peak_vram_mb": 12400
            }
          }
          EOF
          # Seed a baseline file matching the observed numbers.
          cat > /tmp/baseline.json <<'EOF'
          {
            "schema_version": 1,
            "workload": "sft_default_corpus",
            "trainer": "native",
            "gpu": "NVIDIA RTX A6000",
            "secs_per_step": 0.85,
            "peak_vram_mb": 12400,
            "comment": "self-test"
          }
          EOF
          python3 bench-results/check_sft_train_regression.py \
            --bench-stdout /tmp/fake_bench_ok.json \
            --baseline /tmp/baseline.json

      - name: Verify gate detects a step-time regression
        run: |
          cat > /tmp/fake_bench_slow.json <<'EOF'
          {
            "training": {
              "num_steps": 5,
              "total_time_secs": 5.50,
              "secs_per_step": 1.10,
              "peak_vram_mb": 12400
            }
          }
          EOF
          # Baseline 0.85 → observed 1.10 = +29% regression. Default 10%
          # tolerance must fail.
          cat > /tmp/baseline.json <<'EOF'
          {
            "schema_version": 1,
            "workload": "sft_default_corpus",
            "trainer": "native",
            "gpu": "NVIDIA RTX A6000",
            "secs_per_step": 0.85,
            "peak_vram_mb": 12400,
            "comment": "self-test"
          }
          EOF
          if python3 bench-results/check_sft_train_regression.py \
               --bench-stdout /tmp/fake_bench_slow.json \
               --baseline /tmp/baseline.json; then
            echo "ERROR: gate failed to detect the simulated +29% step-time regression" >&2
            exit 1
          fi
          echo "OK — gate correctly returned non-zero on regression"

      - name: Verify gate detects a peak-VRAM regression
        run: |
          cat > /tmp/fake_bench_vram_blew.json <<'EOF'
          {
            "training": {
              "num_steps": 5,
              "total_time_secs": 4.25,
              "secs_per_step": 0.85,
              "peak_vram_mb": 15500
            }
          }
          EOF
          # Baseline 12400 → observed 15500 = +25% VRAM regression. Default
          # 15% tolerance must fail.
          cat > /tmp/baseline.json <<'EOF'
          {
            "schema_version": 1,
            "workload": "sft_default_corpus",
            "trainer": "native",
            "gpu": "NVIDIA RTX A6000",
            "secs_per_step": 0.85,
            "peak_vram_mb": 12400,
            "comment": "self-test"
          }
          EOF
          if python3 bench-results/check_sft_train_regression.py \
               --bench-stdout /tmp/fake_bench_vram_blew.json \
               --baseline /tmp/baseline.json; then
            echo "ERROR: gate failed to detect the simulated +25% VRAM regression" >&2
            exit 1
          fi
          echo "OK — gate correctly returned non-zero on VRAM regression"

      - name: Verify gate seeds a null baseline with --write-baseline-if-null
        run: |
          cat > /tmp/fake_bench_seed.json <<'EOF'
          {
            "training": {
              "num_steps": 5,
              "total_time_secs": 4.25,
              "secs_per_step": 0.85,
              "peak_vram_mb": 12400
            }
          }
          EOF
          cat > /tmp/null_baseline.json <<'EOF'
          {
            "schema_version": 1,
            "workload": "sft_default_corpus",
            "trainer": "native",
            "gpu": "NVIDIA RTX A6000",
            "secs_per_step": null,
            "peak_vram_mb": null
          }
          EOF
          python3 bench-results/check_sft_train_regression.py \
            --bench-stdout /tmp/fake_bench_seed.json \
            --baseline /tmp/null_baseline.json \
            --write-baseline-if-null
          # Confirm the file was updated with the observed values.
          python3 -c "
          import json, sys
          b = json.load(open('/tmp/null_baseline.json'))
          assert b['secs_per_step'] == 0.85, b
          assert b['peak_vram_mb'] == 12400, b
          print('OK — null baseline was seeded:', b)
          "

      - name: Warn when the A6000 perf leg is offline
        if: ${{ vars.KILN_A6000_ONLINE != 'true' }}
        run: |
          echo "::warning::A6000 perf leg offline (repo variable KILN_A6000_ONLINE != 'true') — the Tier-2 hardware perf gate is not running. Set the variable to 'true' after registering a cuda-a6000 self-hosted runner."

  # -------------------------------------------------------------------
  # Tier 2 / Tier 3: actual perf gate against the A6000 baseline.
  #
  # Self-hosted runner labelled `cuda-a6000`. The job only runs when the
  # repository variable KILN_A6000_ONLINE is set to 'true' — without the
  # gate, every nightly cron queued against the (usually offline,
  # spun-up-on-demand) runner for 24h and was auto-cancelled, producing
  # zero perf signal plus daily Actions noise. Flip the variable on
  # (Settings → Secrets and variables → Actions → Variables) after
  # registering a runner; no workflow edit needed. `gate-self-test`
  # above still validates the regression-check script on every dispatch.
  #
  # When the runner IS online, this job:
  #   1. Builds kiln-bench --release --features cuda
  #   2. Runs the training bench on the canonical corpus (the model
  #      path lives at $KILN_BENCH_MODEL_PATH on the self-hosted host).
  #   3. Pipes stdout into check_sft_train_regression.py.
  #   4. Fails if step-time or peak-VRAM regressed beyond tolerance.
  # -------------------------------------------------------------------
  cuda-bench:
    name: A6000 perf gate (${{ matrix.trainer }})
    runs-on: [self-hosted, linux, cuda-a6000]
    needs: gate-self-test
    if: ${{ vars.KILN_A6000_ONLINE == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.latency_fixture_id == 'none')) }}
    strategy:
      fail-fast: false
      matrix:
        trainer:
          - native
          - generic
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify required env vars
        run: |
          if [ -z "${KILN_BENCH_MODEL_PATH:-}" ]; then
            echo "::error::KILN_BENCH_MODEL_PATH must be set on the self-hosted runner" >&2
            exit 1
          fi
          echo "Model path: $KILN_BENCH_MODEL_PATH"

      - name: Build kiln-bench (--release --features cuda)
        run: |
          KILN_CUDA_ARCHS=86 cargo build --release --features cuda --bin kiln-bench

      - name: Run training bench (trainer=${{ matrix.trainer }})
        env:
          # The `native` matrix value asks for cuda_native_sft_train via
          # the env knob the bench reads; `generic` leaves it unset so
          # the trainer dispatches to the BackendRuntime+candle path.
          KILN_CUDA_NATIVE_TRAINING: ${{ matrix.trainer == 'native' && '1' || '0' }}
        run: |
          rm -f /tmp/kiln_bench_stdout.txt
          # Skip inference/latency benches — perf gate is on training step time.
          # Take the median of N steps with the first step's compile warmup
          # already amortised by `kiln-bench`'s internal warmup.
          ./target/release/kiln-bench \
            --model-path "$KILN_BENCH_MODEL_PATH" \
            --training-steps 5 \
            --skip-inference \
            --skip-latency \
            2>&1 | tee /tmp/kiln_bench_stdout.txt

      - name: Compare against baseline
        run: |
          BASELINE_FILE="bench-results/regression/sft_${{ matrix.trainer }}_a6000_baseline.json"
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::error::baseline JSON not found at $BASELINE_FILE" >&2
            exit 1
          fi
          EXTRA_FLAGS=""
          if [ "${{ inputs.write_baseline_if_null }}" = "true" ]; then
            EXTRA_FLAGS="--write-baseline-if-null"
          fi
          python3 bench-results/check_sft_train_regression.py \
            --bench-stdout /tmp/kiln_bench_stdout.txt \
            --baseline "$BASELINE_FILE" \
            $EXTRA_FLAGS

      - name: Upload bench JSON artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sft-${{ matrix.trainer }}-bench-${{ github.run_id }}
          path: /tmp/kiln_bench_stdout.txt
          retention-days: 30

  backend-latency-fixture:
    name: Backend latency fixture (${{ inputs.latency_fixture_id }})
    runs-on: ${{ fromJSON(inputs.latency_runner_labels_json || '["self-hosted"]') }}
    needs: gate-self-test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.latency_fixture_id != 'none' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Run selected backend latency fixture
        run: |
          python3 scripts/run_backend_latency_fixture.py \
            docs/backend-latency-fixtures.json \
            "${{ inputs.latency_fixture_id }}"

      - name: Validate covered latency fixture manifest
        run: |
          python3 scripts/check_backend_latency_fixtures.py docs/backend-latency-fixtures.json --require-covered

      - name: Upload backend latency fixture artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-latency-${{ inputs.latency_fixture_id }}-${{ github.run_id }}
          path: |
            bench-results/backend-latency/*.json
            bench-results/backend-latency/raw/*.log
          if-no-files-found: error
          retention-days: 30
