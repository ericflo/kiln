name: UI smoke

# The server dashboard gets a headless browser smoke against a mock server;
# the desktop shell gets fast static and embedded-script contract checks.
on:
  push:
    branches: [main]
    paths:
      - 'crates/kiln-server/src/ui/**'
      - 'scripts/check_server_ui_smoke.mjs'
      - 'desktop/ui/**'
      - 'scripts/check_desktop_ui_smoke.mjs'
      - 'contracts/thinking-budget-v1.schema.json'
      - 'contracts/thinking-budget-v1.conformance.json'
      - 'scripts/check_thinking_budget_contract.mjs'
      - '.github/workflows/ui-smoke.yml'
  pull_request:
    paths:
      - 'crates/kiln-server/src/ui/**'
      - 'scripts/check_server_ui_smoke.mjs'
      - 'desktop/ui/**'
      - 'scripts/check_desktop_ui_smoke.mjs'
      - 'contracts/thinking-budget-v1.schema.json'
      - 'contracts/thinking-budget-v1.conformance.json'
      - 'scripts/check_thinking_budget_contract.mjs'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

jobs:
  ui-smoke:
    name: Dashboard smoke (headless Chrome)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Check thinking-budget schema and documentation
        run: node scripts/check_thinking_budget_contract.mjs

      - name: Check desktop UI contracts
        run: node scripts/check_desktop_ui_smoke.mjs

      - name: Run dashboard smoke
        # ubuntu-22.04 runners ship Google Chrome and Node 20+ preinstalled.
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "using $CHROME"
          CHROME_BIN="$CHROME" node scripts/check_server_ui_smoke.mjs
