name: Release version diagnostic

# Normal pushes run these sub-second checks in the shared repository contract
# runner. This manual lane remains available when investigating drift alone.
on:
  workflow_dispatch:

jobs:
  check:
    name: Check user-facing release examples
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/check_thinking_budget_contract.mjs
      - run: node scripts/check_runtime_defaults.mjs
      - run: python3 scripts/check_release_versions.py
