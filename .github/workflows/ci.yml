name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos-metal:
    name: macOS / Metal (M-series)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        # Use the rustup that's pre-installed on every GitHub-hosted runner
        # (Linux + macOS) instead of an external action — no third-party
        # versioning to drift. Fixes the chronic macOS Metal failure where
        # `dtolnay/rust-toolchain@stable` was invoking `rustup-init` with a
        # `fetch` subcommand the bundled rustup-init doesn't recognize.
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build (default features — no GPU)
        run: cargo build --locked

      - name: Build (Metal)
        run: cargo build --locked --features metal

      # Env-mutating tests are now serialized via an ENV_LOCK mutex inside
      # the test module, so they no longer race in parallel runs. The
      # `test_health_with_real_backend` skip remains because that test
      # depends on a live network backend and is intentionally excluded
      # from CI.
      - name: Test (default features — exercises CPU fallback)
        run: cargo test --locked -- --skip test_health_with_real_backend

      - name: Test (Metal feature — exercises Apple Silicon GPU path)
        # `--test-threads=1` because concurrent `Device::new_metal(0)` calls
        # panic in candle-metal 0.10.2's MetalDevice::new (`swap_remove` on
        # an empty vec).
        run: |
          cargo test --locked --features metal -- --test-threads=1 --skip test_health_with_real_backend

  linux-default:
    name: Linux / default features
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        # Use the rustup that's pre-installed on every GitHub-hosted runner
        # (Linux + macOS) instead of an external action — no third-party
        # versioning to drift. Fixes the chronic macOS Metal failure where
        # `dtolnay/rust-toolchain@stable` was invoking `rustup-init` with a
        # `fetch` subcommand the bundled rustup-init doesn't recognize.
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build (default features — no CUDA)
        run: cargo build --locked

      - name: Test (default features)
        run: cargo test --locked -- --skip test_health_with_real_backend

  candle-free-crate-tests:
    name: Linux / candle-free crate tests (#1082 transition)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch

      - name: Test candle-free leaf crates directly
        # During the #1082 candle removal the whole-workspace `cargo test`
        # cannot compile `kiln-model` yet (mid-migration candle break), so
        # the per-crate tests in already-candle-free leaf crates never run
        # in the default job. Test them directly to keep coverage and to
        # validate #1082 box work that lands in them (e.g. the kiln-optim
        # AdamW stochastic-rounding path, the kiln-param Phase 2.7 atomic
        # `Parameter::version` epoch counter, and the kiln-autograd tape).
        # None of these depend on kiln-model, so they compile and run on a
        # GPU-less runner.
        run: cargo test --locked -p kiln-optim -p kiln-param -p kiln-autograd

      - name: Validate anomaly trap + deterministic envelope (#1082)
        # `KILN_DETECT_ANOMALY` (autograd NaN/Inf trap probe, kiln-autograd)
        # and `KILN_DETERMINISTIC` (deterministic-variant selector,
        # kiln-tensor) live in candle-free crates, so they validate here
        # WITHOUT the mid-migration default build that the earlier
        # training-path approach (PR #1435) depended on and that cannot
        # compile kiln-model yet. Single-threaded: these tests drive
        # process-global env vars and must not race each other.
        run: |
          KILN_DETECT_ANOMALY=1 cargo test --locked -p kiln-autograd anomaly -- --test-threads=1
          KILN_DETERMINISTIC=1 cargo test --locked -p kiln-tensor determinism -- --test-threads=1

  cuda-candle-free:
    name: CUDA dep tree is candle-free (#1082)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version

      - name: Fetch dependencies
        run: cargo fetch

      - name: Assert no candle in the --features cuda runtime dep tree
        # #1082 DoD line 100: `cargo build --release --features cuda` must have
        # no candle in its dep tree. `cargo tree` resolves manifest metadata
        # only — it never compiles and never runs build scripts — so this is a
        # zero-cost guard on a GPU-less runner (no CUDA toolchain needed).
        # `-e normal` restricts to runtime/build edges; candle survives the
        # CUDA lane only as kiln-server's `[dev-dependencies] candle-core`
        # (integration tests), which `cargo build` never compiles. This guard
        # catches a default-features / feature-list Cargo.toml edit silently
        # resurrecting candle on the CUDA build graph (landed `24e9b5d0`).
        run: |
          set -euo pipefail
          echo "Resolving runtime dep tree: kiln-server --features cuda (normal edges) ..."
          tree="$(cargo tree --locked -p kiln-server --features cuda -e normal)"
          if echo "$tree" | grep -i candle; then
            echo "::error::candle is in the --features cuda runtime dep tree — #1082 DoD line 100 regressed. A Cargo.toml feature/default-features edit likely resurrected candle on the CUDA lane."
            exit 1
          fi
          echo "OK — no candle in the CUDA runtime dep tree."

  linux-vulkan:
    name: Linux / Vulkan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        # Use the rustup that's pre-installed on every GitHub-hosted runner
        # (Linux + macOS) instead of an external action — no third-party
        # versioning to drift. Fixes the chronic macOS Metal failure where
        # `dtolnay/rust-toolchain@stable` was invoking `rustup-init` with a
        # `fetch` subcommand the bundled rustup-init doesn't recognize.
        run: |
          rustup set profile minimal
          rustup default stable
          rustc --version

      - name: Install Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools mesa-vulkan-drivers vulkan-tools

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build (Vulkan)
        run: cargo check --locked -p kiln-server --features vulkan

      - name: Test Vulkan kernel crate
        run: cargo test --locked -p kiln-vulkan-kernel --test gdn_parity -- --nocapture

  cargo-deny:
    name: cargo-deny (license / source / bans policy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # Pin to an exact commit SHA so the bundled cargo-deny CLI version cannot
      # drift on us. v2.0.17 bundles cargo-deny 0.19.2, which is the version the
      # `unmaintained = "workspace"` Scope syntax in deny.toml is validated
      # against (cargo-deny ≤ 0.17 still parses that field as a deprecated
      # LintLevel and will reject "workspace"). Bump this pin deliberately when
      # we want a newer cargo-deny — see the README for the action.
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.17 (cargo-deny 0.19.2)
        with:
          command: check
          # Run all checks: licenses, sources, bans, advisories
          arguments: --all-features
