name: Qualification contract diagnostic

# Normal pushes run these checks in repository-hygiene.yml's single shared
# runner. Keep an explicit manual entry point for focused diagnosis.
on:
  workflow_dispatch:

jobs:
  validate:
    name: Portable qualification evidence
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_runtime_env_contract.py --check
      - run: python3 scripts/check_source_parsing_tests.py
      - name: Validate tooling and receipts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/qualification/tests -v
          mapfile -d '' receipts < <(find qualification/receipts -type f -name '*.json' -print0 | sort -z)
          if [ "${#receipts[@]}" -gt 0 ]; then
            python3 scripts/qualification/receipt.py "${receipts[@]}"
          fi
          git fetch --no-tags --depth=1 origin 9371035bfeb3908ebf47bd107eb53f98c529be3e
          scripts/qualification/validate_retained_evidence.sh
