name: Qualification contract

# Keep hardware qualification local, but validate its portable contracts and
# checked-in evidence on the inexpensive GitHub-hosted CPU runner. This is a
# separate workflow so a receipt-only commit does not rebuild the Rust workspace.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'contracts/repository-artifact-policy-v1.json'
      - 'contracts/runtime-env-direct-reads-v1.json'
      - 'contracts/source-parsing-test-inventory-v1.json'
      - 'scripts/check_repository_artifacts.py'
      - 'scripts/check_runtime_env_contract.py'
      - 'scripts/check_source_parsing_tests.py'
      - 'scripts/*backend_latency*.py'
      - 'scripts/qualification/**'
      - 'scripts/bench-concurrent-batch.py'
      - 'scripts/run-serving-benchmark-campaign.py'
      - 'docs/backend-latency-fixtures.json'
      - 'docs/backend-latency-result-schema.md'
      - 'qualification/**'
      - 'bench-results/backend-latency/*.json'
      - 'benchmarks/receipts/**'
      - '.github/workflows/qualification-contract.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'contracts/repository-artifact-policy-v1.json'
      - 'contracts/runtime-env-direct-reads-v1.json'
      - 'contracts/source-parsing-test-inventory-v1.json'
      - 'scripts/check_repository_artifacts.py'
      - 'scripts/check_runtime_env_contract.py'
      - 'scripts/check_source_parsing_tests.py'
      - 'scripts/*backend_latency*.py'
      - 'scripts/qualification/**'
      - 'scripts/bench-concurrent-batch.py'
      - 'scripts/run-serving-benchmark-campaign.py'
      - 'docs/backend-latency-fixtures.json'
      - 'docs/backend-latency-result-schema.md'
      - 'qualification/**'
      - 'bench-results/backend-latency/*.json'
      - 'benchmarks/receipts/**'
      - '.github/workflows/qualification-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Portable qualification evidence
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Ratchet direct environment access
        run: python3 scripts/check_runtime_env_contract.py --check

      - name: Ratchet implementation-source parsing tests
        run: python3 scripts/check_source_parsing_tests.py

      - name: Validate tooling and receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/qualification/tests -v
          mapfile -d '' receipts < <(find qualification/receipts -type f -name '*.json' -print0 | sort -z)
          if [ "${#receipts[@]}" -gt 0 ]; then
            python3 scripts/qualification/receipt.py "${receipts[@]}"
          fi
          mapfile -d '' benchmark_receipts < <(find benchmarks/receipts -type f -name '*.json' -print0 | sort -z)
          if [ "${#benchmark_receipts[@]}" -gt 0 ]; then
            python3 scripts/bench-concurrent-batch.py --validate-receipt "${benchmark_receipts[@]}"
          fi
          mapfile -d '' oracle_results < <(find qualification/oracle-results -type f -name '*.json' -print0 | sort -z)
          if [ "${#oracle_results[@]}" -gt 0 ]; then
            python3 scripts/qualification/rocm_hf_next_token_oracle.py check "${oracle_results[@]}"
          fi
