name: OpenEnv upstream edge

# Change-driven pinned interoperability runs inside CI's already-warm Rust job.
# This standalone lane is only the weekly upstream-head canary and a manual
# diagnostic, so normal pushes never pay for a second workspace compilation.
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openenv-upstream-edge
  cancel-in-progress: true

jobs:
  upstream-edge:
    name: Current upstream OpenEnv matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Check out the current OpenEnv wire oracle
        run: |
          git clone --filter=blob:none https://github.com/ericflo/miniopenenv.git ../miniopenenv
          git -C ../miniopenenv checkout --detach origin/main
          echo "OPENENV_INTEROP_ORACLE_SHA=$(git -C ../miniopenenv rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate contracts and current upstream environments
        env:
          OPENENV_INTEROP_ROOT: ${{ github.workspace }}/../miniopenenv
        run: |
          python3 scripts/check_openenv_contract.py --self-test
          python3 scripts/check_http_api_contract.py
          scripts/check_miniopenenv_interop.sh
